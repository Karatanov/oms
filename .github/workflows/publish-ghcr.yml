name: Publish OMS container

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# The workflow needs no long-lived registry token. GitHub supplies a scoped
# GITHUB_TOKEN that may write packages only for this repository.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    # A newer commit supersedes an image that is still being built. Keep this
    # separate from deployment concurrency so a live rollout is never killed.
    concurrency:
      group: oms-ghcr-build-${{ github.ref }}
      cancel-in-progress: true
    # The BuildKit cache retains independent frontend/server stages. A changed
    # server route therefore does not rebuild the production WASM bundle.
    # A clean build remains valid if the cache is unavailable.
    # Production Webpack/Terser takes roughly 20 minutes for the current
    # Compose graph. Keep a firm ceiling without forcing a development bundle.
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Same-repository PRs publish an immutable SHA image so performance can
      # be measured in an isolated staging container before merge. Fork PRs
      # remain build-only because their token must not receive package write
      # access.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and publish Linux image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            OMS_GIT_SHA=${{ github.sha }}
            OMS_BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=oms-production-container
          cache-to: type=gha,mode=max,scope=oms-production-container,ignore-error=true

  deploy-production:
    name: Deploy production VPS
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialize production changes independently from cancellable image builds.
    concurrency:
      group: oms-production-vps
      cancel-in-progress: false
    environment:
      name: production
      url: https://ua-oms.com/
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      DEPLOY_HOST: 2.24.162.154
      DEPLOY_USER: root
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Check out deployment script
        uses: actions/checkout@v6

      - name: Require successful regression workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required_workflows=(
            'Backend regression tests'
            'Project form regression tests'
          )
          for workflow in "${required_workflows[@]}"; do
            verified=false
            for _ in $(seq 1 30); do
              state="$({
                curl --fail --silent --show-error \
                  -H 'Accept: application/vnd.github+json' \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=100"
              } | jq -r --arg name "$workflow" '
                [.workflow_runs[] | select(.name == $name)] | first |
                if . == null then "missing" else "\(.status) \(.conclusion // "")" end
              ')"
              read -r status conclusion <<< "$state"
              if [[ "$status" == completed ]]; then
                if [[ "$conclusion" != success ]]; then
                  echo "$workflow finished with $conclusion" >&2
                  exit 1
                fi
                echo "$workflow passed"
                verified=true
                break
              fi
              echo "Waiting for $workflow (status: $status)"
              sleep 10
            done
            if [[ "$verified" != true ]]; then
              echo "Timed out waiting for $workflow" >&2
              exit 1
            fi
          done

      - name: Configure pinned SSH identity
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/oms_vps
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/oms_vps ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/oms_vps >/dev/null
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null

      - name: Authorize the VPS to pull this build
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/oms_vps \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io --username '${{ github.actor }}' --password-stdin"

      - name: Deploy immutable image with automatic rollback
        run: |
          set -euo pipefail
          # The VPS keeps secrets only in its local .env. Sync the versioned
          # Compose routing labels separately so domain/TLS changes travel with
          # the application image without exposing or replacing that file.
          scp -i ~/.ssh/oms_vps \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            deploy/vps/docker-compose.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:/docker/oms/docker-compose.yml"
          ssh -i ~/.ssh/oms_vps \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$IMAGE_TAG' '${{ github.sha }}'" \
            < deploy/vps/deploy.sh

      - name: Verify public HTTPS
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            --max-time 15 https://ua-oms.com/health
          deployed_revision="$(curl --fail --silent --show-error --max-time 15 https://ua-oms.com/version | jq -r '.revision')"
          test "$deployed_revision" = "${GITHUB_SHA:0:12}"
          redirect_headers="$(curl --fail --silent --show-error --location --max-time 15 \
            --write-out '%{url_effective}' --output /dev/null https://www.ua-oms.com/)"
          test "$redirect_headers" = "https://ua-oms.com/"

      # A healthy API alone does not prove that the browser application can
      # start. /app.html may intentionally return the unauthenticated login
      # page, so inspect the immutable Compose shell at /index.html and every
      # versioned JS/WASM resource before marking a rollout healthy.
      - name: Verify browser application shell and assets
        run: |
          set -euo pipefail
          base_url='https://ua-oms.com'
          app_html="$(curl --fail --silent --show-error --max-time 30 "$base_url/index.html")"
          grep -Fq 'composeApp.' <<< "$app_html"
          ! grep -Fq '__OMS_WASM_ASSET__' <<< "$app_html"
          manifest="$(curl --fail --silent --show-error --max-time 30 "$base_url/assets-manifest.json")"
          jq -e '.version | type == "string" and length > 0' <<< "$manifest" >/dev/null
          jq -e '.assets | type == "array" and length >= 2' <<< "$manifest" >/dev/null
          while IFS=$'\t' read -r asset_url expected_bytes; do
            test -n "$asset_url"
            asset_file="$(mktemp)"
            trap 'rm -f "$asset_file"' EXIT
            curl --fail --silent --show-error --max-time 60 \
              --output "$asset_file" "$base_url/$asset_url"
            actual_bytes="$(wc -c < "$asset_file")"
            test "$actual_bytes" -eq "$expected_bytes"
            rm -f "$asset_file"
            trap - EXIT
          done < <(jq -r '.assets[] | [.url, .bytes] | @tsv' <<< "$manifest")

      - name: Remove temporary registry credentials
        if: always()
        run: |
          ssh -i ~/.ssh/oms_vps \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'docker logout ghcr.io >/dev/null 2>&1 || true'
