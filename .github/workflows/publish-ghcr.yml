name: Publish OMS container

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# The workflow needs no long-lived registry token. GitHub supplies a scoped
# GITHUB_TOKEN that may write packages only for this repository.
permissions:
  contents: read
  packages: write

concurrency:
  group: oms-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    # A failed cache transfer used to leave a runner occupied indefinitely.
    # The image is released infrequently, so a deterministic clean build is
    # preferable to an unreliable remote BuildKit cache.
    # Production Webpack/Terser takes roughly 20 minutes for the current
    # Compose graph. Keep a firm ceiling without forcing a development bundle.
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and publish Linux image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
