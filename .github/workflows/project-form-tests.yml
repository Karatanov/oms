name: Project form regression tests
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'composeApp/**'
      - 'tools/test-date-picker.cjs'
      - '.github/workflows/project-form-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin form validation in Chrome Headless
        run: bash gradlew -PrenderJsOnly :composeApp:jsBrowserTest --no-daemon --max-workers=1
      - name: Install isolated browser test tools
        run: |
          npm install --prefix build/date-picker-test playwright
          build/date-picker-test/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Date overlay in Chromium and WebKit
        run: node tools/test-date-picker.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-form-test-results
          path: composeApp/build/reports/tests/
