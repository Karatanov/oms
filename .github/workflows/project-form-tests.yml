name: Project form regression tests
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - 'composeApp/**'
      - 'tools/test-date-picker.cjs'
      - 'tools/test-browser-auth.cjs'
      - 'tools/test-login-entrypoint.cjs'
      - '.github/workflows/project-form-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin form validation in Chrome Headless
        run: bash gradlew -PrenderJsOnly :composeApp:jsBrowserTest --no-daemon --max-workers=1
      - name: Install isolated browser test tools
        run: |
          npm install --prefix build/date-picker-test playwright
          build/date-picker-test/node_modules/.bin/playwright install --with-deps chromium webkit firefox
      - name: Date overlay in Chromium and WebKit
        run: node tools/test-date-picker.cjs
      - name: Cookie-free authentication in Chromium, WebKit and Firefox
        run: node tools/test-browser-auth.cjs
      - name: Lightweight login routing for VPS and Pages
        run: node tools/test-login-entrypoint.cjs
      - name: Authenticated startup shell in Chromium
        run: node tools/test-startup-shell.cjs
      - name: Content-scoped native loading overlay in Chromium
        run: node tools/test-route-overlay.cjs
      - name: Build development bundle for early navigation regressions
        run: |
          bash gradlew -PrenderJsOnly :composeApp:jsBrowserDevelopmentWebpack --no-daemon --max-workers=1
          mkdir -p build/navigation-fixture
          cp -a composeApp/build/processedResources/js/main/. build/navigation-fixture/
          cp -a composeApp/build/kotlin-webpack/js/developmentExecutable/. build/navigation-fixture/
          cp build/navigation-fixture/index.html build/navigation-fixture/app.html
      - name: Real Compose navigation regression tests
        env:
          OMS_SMOKE_ASSETS: build/navigation-fixture
        run: node tools/test-route-transitions.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-form-test-results
          path: composeApp/build/reports/tests/
