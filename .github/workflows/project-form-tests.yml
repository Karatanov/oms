name: Project form regression tests
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # The browser checks share a cold cache only on their first run. Give that
    # legitimate download time, rather than having Actions report it as a
    # cancelled test suite.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Kotlin form validation in Chrome Headless
        run: bash gradlew -PrenderJsOnly :composeApp:jsBrowserTest --no-daemon --max-workers=1

      # Browser downloads are much larger and slower than the small test
      # scripts. Keep them between runs so deployment does not spend several
      # minutes re-downloading identical Chromium/WebKit/Firefox binaries.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.63.0

      - name: Install isolated browser test tools
        run: |
          npm install --prefix build/date-picker-test playwright@1.63.0
          # ubuntu-latest already provides the shared libraries needed by the
          # supported Playwright browsers. `--with-deps` forces a large apt
          # transaction on every run (and exhausted this workflow's timeout),
          # while the cached browser binaries only need a normal install.
          build/date-picker-test/node_modules/.bin/playwright install chromium webkit firefox
      - name: Date overlay in Chromium and WebKit
        run: node tools/test-date-picker.cjs
      - name: Cookie-free authentication in Chromium, WebKit and Firefox
        run: node tools/test-browser-auth.cjs
      - name: Lightweight login routing for VPS and Pages
        run: node tools/test-login-entrypoint.cjs
      - name: Authenticated startup shell in Chromium
        run: node tools/test-startup-shell.cjs
      - name: Post-login progress and handoff in Chromium
        run: node tools/test-startup-progress.cjs
      - name: Content-scoped native loading overlay in Chromium
        run: node tools/test-route-overlay.cjs
      - name: Build development bundle for early navigation regressions
        run: |
          bash gradlew -PrenderJsOnly :composeApp:jsBrowserDevelopmentWebpack --no-daemon --max-workers=1
          mkdir -p build/navigation-fixture
          cp -a composeApp/build/processedResources/js/main/. build/navigation-fixture/
          cp -a composeApp/build/kotlin-webpack/js/developmentExecutable/. build/navigation-fixture/
          cp build/navigation-fixture/index.html build/navigation-fixture/app.html
      - name: Real Compose navigation regression tests
        env:
          OMS_SMOKE_ASSETS: build/navigation-fixture
        run: node tools/test-route-transitions.cjs
      - name: Mobile and tablet layouts in Chromium
        env:
          OMS_SMOKE_ASSETS: build/navigation-fixture
        run: node tools/test-mobile-layout.cjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: project-form-test-results
          path: |
            composeApp/build/reports/tests/
            build/mobile-layout-screenshots/
