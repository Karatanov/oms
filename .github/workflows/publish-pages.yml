name: Publish OMS frontend to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: oms-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check browser regex compatibility
        run: node tools/check-web-regex.cjs

      - name: Check clipboard event handling
        run: node tools/check-clipboard-events.cjs

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build production web frontend
        run: gradle -PrenderJsOnly :composeApp:jsBrowserProductionWebpack --no-daemon --max-workers=1

      - name: Assemble Pages site
        run: |
          mkdir -p build/pages
          cp -a composeApp/build/processedResources/js/main/. build/pages/
          cp -a composeApp/build/kotlin-webpack/js/productionExecutable/. build/pages/
          touch build/pages/.nojekyll
          test -f build/pages/index.html
          test -f build/pages/composeApp.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
