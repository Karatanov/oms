name: Publish OMS frontend to GitHub Pages

on:
  workflow_run:
    workflows: [Publish OMS container]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful container workflow run (blank = current commit)
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Some Pages composite actions currently include a Node 20 child action. Hosted
# runners support Node 24, so opt into it consistently for every nested step.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: oms-pages
  cancel-in-progress: true

jobs:
  source:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
      sha: ${{ steps.source.outputs.sha }}
      current: ${{ steps.source.outputs.current }}
    steps:
      - name: Select trusted, matching production frontend
        id: source
        uses: actions/github-script@v8
        with:
          script: |
            const repo = context.repo;
            let run = context.payload.workflow_run;
            if (!run) {
              const requested = context.payload.inputs?.source_run_id;
              if (requested) {
                if (!/^\d+$/.test(requested)) throw new Error('Invalid source run ID');
                run = (await github.rest.actions.getWorkflowRun({...repo, run_id: Number(requested)})).data;
              } else {
                run = (await github.rest.actions.listWorkflowRuns({
                  ...repo, workflow_id: 'publish-ghcr.yml', head_sha: context.sha,
                  event: 'push', status: 'success', per_page: 10
                })).data.workflow_runs[0];
              }
            }
            if (!run || run.name !== 'Publish OMS container' || run.event !== 'push' ||
                run.conclusion !== 'success' || run.head_branch !== 'master' ||
                run.head_repository?.full_name !== `${repo.owner}/${repo.repo}`) {
              throw new Error('A successful same-repository master push is required; no untrusted PR artifacts');
            }
            const head = (await github.rest.repos.getBranch({...repo, branch: 'master'})).data.commit.sha;
            core.setOutput('current', String(head === run.head_sha));
            if (head !== run.head_sha) {
              core.notice('Skipping superseded release rather than rolling Pages back');
              return;
            }
            core.setOutput('run_id', String(run.id));
            core.setOutput('sha', run.head_sha);

  build:
    needs: source
    if: needs.source.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Check browser regex compatibility
        run: node tools/check-web-regex.cjs

      - name: Check clipboard event handling
        run: node tools/check-clipboard-events.cjs
      - name: Check button cursor policy
        run: node tools/check-button-cursors.cjs

      - name: Check SIR photo association handling
        run: node tools/check-sir-photo-associations.cjs

      # Reuse the exact frontend already packaged into the release container.
      # Never spend another ~20 minutes compiling the same commit for Pages.
      - name: Download release frontend
        uses: actions/download-artifact@v7
        with:
          name: oms-production-frontend
          path: frontend-dist
          run-id: ${{ needs.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Assemble Pages site
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          node tools/assemble-pages.cjs frontend-dist build/pages "$SOURCE_SHA"
          test -f build/pages/index.html
          test -f build/pages/app.html
          test -f build/pages/composeApp.js
          test -f build/pages/assets-manifest.json
          grep -q 'id="login-form"' build/pages/index.html
          grep -q 'composeApp.js' build/pages/app.html

      - name: Configure GitHub Pages
        # The same production bundle is tested before upload/deployment.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Test real application navigation
        env:
          OMS_SMOKE_ASSETS: build/pages
        run: |
          npm install --prefix build/date-picker-test playwright
          build/date-picker-test/node_modules/.bin/playwright install --with-deps chromium
          node tools/test-route-transitions.cjs

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

      - name: Upload navigation failure screenshot
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: navigation-failure
          path: build/route-transition-failure.png

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
