name: Publish OMS frontend to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: oms-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check browser regex compatibility
        run: node tools/check-web-regex.cjs

      - name: Check clipboard event handling
        run: node tools/check-clipboard-events.cjs
      - name: Check button cursor policy
        run: node tools/check-button-cursors.cjs

      - name: Check SIR photo association handling
        run: node tools/check-sir-photo-associations.cjs

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build production web frontend
        run: gradle -PrenderJsOnly :composeApp:jsBrowserProductionWebpack --no-daemon --max-workers=1

      - name: Assemble Pages site
        run: |
          mkdir -p build/pages
          cp -a composeApp/build/processedResources/js/main/. build/pages/
          cp -a composeApp/build/kotlin-webpack/js/productionExecutable/. build/pages/
          cp build/pages/index.html build/pages/app.html
          cp composeApp/src/webMain/resources/login.html build/pages/index.html
          cp composeApp/src/webMain/resources/favicon.svg build/pages/favicon.svg
          cp composeApp/src/webMain/resources/social-preview.png build/pages/social-preview.png
          test -f build/pages/skiko.wasm
          asset_hash=$(sha256sum build/pages/composeApp.js | cut -c1-12)
          sed -i "s#__OMS_ASSET_VERSION__#v=${asset_hash}#g" build/pages/app.html
          sed -i "s#skiko\\.wasm#skiko.wasm?v=${asset_hash}#g" build/pages/composeApp.js
          js_bytes=$(stat -c %s build/pages/composeApp.js)
          wasm_bytes=$(stat -c %s build/pages/skiko.wasm)
          printf '{"version":"%s","assets":[{"url":"composeApp.js","bytes":%s},{"url":"skiko.wasm?v=%s","bytes":%s}]}\n' "$GITHUB_SHA" "$js_bytes" "$GITHUB_SHA" "$wasm_bytes" > build/pages/assets-manifest.json
          touch build/pages/.nojekyll
          test -f build/pages/index.html
          test -f build/pages/app.html
          test -f build/pages/composeApp.js
          test -f build/pages/assets-manifest.json
          grep -q 'id="login-form"' build/pages/index.html
          grep -q 'composeApp.js' build/pages/app.html

      - name: Configure GitHub Pages
        # The same production bundle is tested before upload/deployment.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Test real application navigation
        env:
          OMS_SMOKE_ASSETS: build/pages
        run: |
          npm install --prefix build/date-picker-test playwright
          build/date-picker-test/node_modules/.bin/playwright install --with-deps chromium
          node tools/test-route-transitions.cjs

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

      - name: Upload navigation failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-failure
          path: build/route-transition-failure.png

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
