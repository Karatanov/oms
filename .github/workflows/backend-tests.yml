name: Backend regression tests
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: oms_performance_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      OMS_TEST_DATABASE_URL: jdbc:mysql://127.0.0.1:3306/oms_performance_test?allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew :server:test --no-daemon --max-workers=2
      - name: Preserve test results and benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            server/build/test-results/test/
            server/build/reports/tests/test/
