<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ufsi</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
    <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let ufsiLeafletMap = null;
        let ufsiMarkersLayer = null;
        let ufsiOnProjectClick = null;

        const ukraineBounds = [
            [44.0, 22.0],
            [52.5, 40.5]
        ];

        function initLeafletMap() {
            const mapHost = document.getElementById("map-host");
            if (!mapHost || ufsiLeafletMap) return;

            ufsiLeafletMap = L.map("map-host", {
                zoomControl: true,
                minZoom: 5,
                maxZoom: 18,
                maxBounds: ukraineBounds,
                maxBoundsViscosity: 1.0
            });

            L.tileLayer(
                "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                {
                    attribution: "&copy; OpenStreetMap contributors"
                }
            ).addTo(ufsiLeafletMap);

            ufsiMarkersLayer = L.layerGroup().addTo(ufsiLeafletMap);
            ufsiLeafletMap.fitBounds(ukraineBounds);
        }

        function showLeafletMapPane() {
            document.body.classList.add("map-visible");
            initLeafletMap();

            setTimeout(() => {
                if (ufsiLeafletMap) {
                    ufsiLeafletMap.invalidateSize();
                    ufsiLeafletMap.fitBounds(ukraineBounds);
                }
            }, 250);
        }

        function hideLeafletMapPane() {
            document.body.classList.remove("map-visible");
        }

        function setLeafletProjectClickHandler(handler) {
            ufsiOnProjectClick = handler;
        }

        function setLeafletProjects(projectsJson) {
            initLeafletMap();

            if (!ufsiLeafletMap || !ufsiMarkersLayer) return;

            ufsiMarkersLayer.clearLayers();

            const projects = JSON.parse(projectsJson);

            if (!projects.length) {
                ufsiLeafletMap.fitBounds(ukraineBounds);
                return;
            }

            projects.forEach(project => {
                const lat = project.latitude;
                const lng = project.longitude;
                const color = project.statusColor;

                const popupHtml = `
                <div style="min-width: 180px;">
                    <strong>${project.name}</strong><br/>
                    ${project.regionLabel}: ${project.region}<br/>
                    ${project.statusLabel}: ${project.statusText}<br/><br/>
                    <button
                        type="button"
                        onclick="ufsiOnProjectClick && ufsiOnProjectClick(${project.id})"
                        style="
                            width: 100%;
                            padding: 8px 12px;
                            border: none;
                            border-radius: 8px;
                            cursor: pointer;
                            background: #278DAD;
                            color: white;
                            font-weight: 600;
                        "
                    >
                        Деталі
                    </button>
                </div>
            `;

                L.circleMarker([lat, lng], {
                    radius: 9,
                    color: color,
                    weight: 3,
                    fillColor: color,
                    fillOpacity: 0.85
                })
                    .bindPopup(popupHtml)
                    .addTo(ufsiMarkersLayer);
            });

            ufsiLeafletMap.fitBounds(ukraineBounds);
        }

        window.addEventListener("load", () => {
            initLeafletMap();
        });
    </script>
</head>
<body>
<div id="app-shell">
    <div id="compose-host"></div>
    <div id="map-pane">
        <div id="map-host"></div>
    </div>
</div>
<!--suppress HtmlUnknownTarget -->
<script type="application/javascript" src="composeApp.js"></script>
</body>
</html>
