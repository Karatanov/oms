<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ufsi</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
    <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script>
        function omsApiUrl(path) {
            const local = ["localhost", "127.0.0.1"].includes(window.location.hostname);
            const base = local && window.location.port === "8081"
                ? `${window.location.protocol}//${window.location.hostname}:8080/api/v1` : "/api/v1";
            return `${base}${path}`;
        }

        let ufsiLeafletMap = null;
        let ufsiMarkersLayer = null;
        let ufsiOnProjectClick = null;
        let omsLanguage = "uk";
        const omsBrowserStrings = {
            uk: {
                importReportError: "Не вдалося імпортувати інспекційний звіт",
                uploadFileError: "Не вдалося завантажити файл",
                documentUploaded: "Документ успішно завантажено.", photoUploaded: "Фото успішно завантажено.",
                financialImported: "Фінансові записи успішно імпортовано.", photoTitle: "Фотографії інспекції",
                photoRules: "Перетягніть фотографії сюди або виберіть файли. Лише JPEG/PNG, до 10 МБ кожен, максимум 30 фотографій.",
                photoDrop: "Перетягніть фотографії сюди або натисніть для вибору", done: "Готово", remove: "Видалити",
                invalidPhoto: "дозволені лише JPEG/PNG-файли розміром до 10 МБ.", maxPhotos: "Можна прикріпити максимум 30 фотографій.",
                lastInspection: "Остання інспекція", inspectionCode: "Код інспекції", noReports: "Інспекційних звітів ще немає", noPhotos: "В останній інспекції немає фотографій.",
                open: "Відкрити", closeFullscreenPhoto: "Закрити повноекранне фото", details: "Деталі",
                loading: "Завантаження даних…", uploadingFile: "Завантаження файлу…", importingInspection: "Імпорт інспекційного звіту…", importingFinancial: "Імпорт фінансових записів…"
            },
            en: {
                importReportError: "Could not import inspection report", uploadFileError: "Could not upload file",
                documentUploaded: "Document uploaded successfully.", photoUploaded: "Photo uploaded successfully.",
                financialImported: "Financial records imported successfully.", photoTitle: "Inspection photos",
                photoRules: "Drag photos here or choose files. JPEG/PNG only, up to 10 MB each, maximum 30 photos.",
                photoDrop: "Drag photos here or click to select", done: "Done", remove: "Remove",
                invalidPhoto: "only JPEG/PNG files up to 10 MB are allowed.", maxPhotos: "You can attach up to 30 photos.",
                lastInspection: "Latest inspection", inspectionCode: "Inspection code", noReports: "No Inspection Reports yet", noPhotos: "No photos in the latest inspection.",
                open: "Open", closeFullscreenPhoto: "Close full-screen photo", details: "Details",
                loading: "Loading data…", uploadingFile: "Uploading file…", importingInspection: "Importing inspection report…", importingFinancial: "Importing financial records…"
            }
        };
        function setOmsLanguage(language) { omsLanguage = language === "en" ? "en" : "uk"; }
        function omsText(key) { return omsBrowserStrings[omsLanguage][key] || omsBrowserStrings.uk[key] || key; }

        let omsLoadingRequests = 0;
        function showOmsLoading(message) {
            let overlay = document.getElementById("oms-loading-overlay");
            if (!overlay) {
                overlay = document.createElement("div");
                overlay.id = "oms-loading-overlay";
                overlay.innerHTML = '<div class="oms-loading-card"><span class="oms-loading-spinner"></span><span class="oms-loading-message"></span></div>';
                document.body.appendChild(overlay);
            }
            omsLoadingRequests += 1;
            overlay.querySelector(".oms-loading-message").textContent = message || omsText("loading");
            overlay.classList.add("visible");
        }

        function hideOmsLoading() {
            omsLoadingRequests = Math.max(0, omsLoadingRequests - 1);
            if (omsLoadingRequests === 0) document.getElementById("oms-loading-overlay")?.classList.remove("visible");
        }

        function formatDateForInput(epochMillis) {
            const date = new Date(epochMillis);
            const year = date.getUTCFullYear();
            const month = String(date.getUTCMonth() + 1).padStart(2, "0");
            const day = String(date.getUTCDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        function currentIsoDate() {
            const date = new Date();
            const local = new Date(date.getTime() - date.getTimezoneOffset() * 60_000);
            return local.toISOString().slice(0, 10);
        }

        function daysBetweenIsoDates(start, end) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(start || "") || !/^\d{4}-\d{2}-\d{2}$/.test(end || "")) return null;
            const startMs = Date.parse(start + "T00:00:00Z");
            const endMs = Date.parse(end + "T00:00:00Z");
            const days = Math.round((endMs - startMs) / 86400000);
            return days >= 0 ? days : null;
        }

        // Browser-native date input is dependable in Wasm and provides a calendar on desktop/mobile.
        function openNativeDatePicker(value, anchorLeft, anchorTop, onSelected) {
            document.querySelectorAll(".oms-native-date-input").forEach(input => input.remove());
            const input = document.createElement("input");
            input.className = "oms-native-date-input";
            input.type = "date";
            input.value = /^\d{4}-\d{2}-\d{2}$/.test(value || "") ? value : currentIsoDate();
            input.style.position = "fixed";
            // Compose/Wasm controls do not reliably become document.activeElement.
            // Position the native input from the measured calendar-button coordinates instead.
            const left = Math.max(12, Math.min(Number(anchorLeft) || 16, window.innerWidth - 280));
            const top = Math.max(12, Math.min(Number(anchorTop) || 16, window.innerHeight - 40));
            input.style.left = `${left}px`;
            input.style.top = `${top}px`;
            input.style.width = "1px";
            input.style.height = "1px";
            input.style.opacity = "0";
            input.style.pointerEvents = "none";
            document.body.appendChild(input);
            const remove = () => input.remove();
            input.addEventListener("change", () => { if (input.value) onSelected(input.value); remove(); }, { once: true });
            input.addEventListener("blur", () => setTimeout(remove, 100), { once: true });
            input.focus({ preventScroll: true });
            input.showPicker?.();
            input.click();
        }

        function formatOmsDate(value) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(value || "")) return value || "";
            const [year, month, day] = value.split("-");
            return `${day}.${month}.${year}`;
        }

        const ukraineBounds = [
            [44.0, 22.0],
            [52.5, 40.5]
        ];

        // Leaflet calculates the zoom from the current element size.  The map host is
        // hidden while the other screens are open, so fitting it only during
        // initialisation can calculate a zoom for a zero-sized element.  Always reset
        // the overview after the host becomes visible and has been measured.
        function fitUkraineOverview() {
            if (!ufsiLeafletMap) return;
            ufsiLeafletMap.invalidateSize();
            ufsiLeafletMap.fitBounds(ukraineBounds, { padding: [24, 24] });
        }

        function initLeafletMap() {
            const mapHost = document.getElementById("map-host");
            if (!mapHost || ufsiLeafletMap) return;

            ufsiLeafletMap = L.map("map-host", {
                zoomControl: true,
                minZoom: 5,
                maxZoom: 18,
                maxBounds: ukraineBounds,
                maxBoundsViscosity: 1.0
            });

            L.tileLayer(
                "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                {
                    attribution: "&copy; OpenStreetMap contributors"
                }
            ).addTo(ufsiLeafletMap);

            ufsiMarkersLayer = L.markerClusterGroup({
                showCoverageOnHover: false,
                spiderfyOnMaxZoom: true,
                zoomToBoundsOnClick: true,
                maxClusterRadius: 58,
                iconCreateFunction: cluster => L.divIcon({
                    html: `<span>${cluster.getChildCount()}</span>`,
                    className: "oms-project-cluster",
                    iconSize: L.point(52, 52),
                    iconAnchor: L.point(26, 26)
                })
            }).addTo(ufsiLeafletMap);
            fitUkraineOverview();
        }

        function setOmsPaneBounds(id, x, y, width, height) {
            const pane = document.getElementById(id);
            if (!pane) return;
            pane.classList.toggle("oms-pane-clipped", height <= 0 || width <= 0);
            Object.assign(pane.style, { left: x + "px", top: y + "px", width: width + "px", height: height + "px", right: "auto", bottom: "auto" });
            if (id === "map-pane" && ufsiLeafletMap) ufsiLeafletMap.invalidateSize({pan: false});
        }

        function setOmsCanvasOverlay(active) {
            document.body.classList.toggle("canvas-overlay-open", active);
        }

        function showLeafletMapPane() {
            document.body.classList.add("map-visible");
            initLeafletMap();

            setTimeout(() => {
                fitUkraineOverview();
            }, 250);
        }

        function hideLeafletMapPane() {
            document.body.classList.remove("map-visible");
        }

        function setLeafletProjectClickHandler(handler) {
            ufsiOnProjectClick = handler;
        }

        function openSirImportDialog(projectUuid, onComplete) {
            const input = document.createElement("input");
            input.type = "file";
            input.accept = ".xls,.xlsx,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
            input.style.display = "none";
            document.body.appendChild(input);
            input.onchange = async () => {
                const file = input.files && input.files[0];
                if (!file) {
                    input.remove();
                    return;
                }
                const formData = new FormData();
                formData.append("file", file, file.name);
                showOmsLoading(omsText("importingInspection"));
                try {
                    const response = await fetch(omsApiUrl(`/projects/${projectUuid}/inspection-reports/import`), {
                        method: "POST",
                        body: formData,
                        credentials: "include"
                    });
                    if (!response.ok) throw new Error(await response.text());
                    onComplete("");
                } catch (error) {
                    onComplete(error.message || String(error));
                } finally {
                    hideOmsLoading();
                    input.remove();
                }
            };
            input.click();
        }

        function uploadWithDialog(accept, url, extraFields, successMessage, onComplete = null, loadingMessage = omsText("uploadingFile")) {
            const input = document.createElement("input");
            input.type = "file";
            input.accept = accept;
            input.style.display = "none";
            document.body.appendChild(input);
            input.onchange = async () => {
                const file = input.files && input.files[0];
                if (!file) {
                    input.remove();
                    return;
                }
                const formData = new FormData();
                Object.entries(extraFields).forEach(([key, value]) => formData.append(key, value));
                formData.append("file", file, file.name);
                showOmsLoading(loadingMessage);
                try {
                    const response = await fetch(url, { method: "POST", body: formData, credentials: "include" });
                    if (!response.ok) throw new Error(await response.text());
                    window.alert(successMessage);
                    if (onComplete) onComplete("");
                    else window.location.reload();
                } catch (error) {
                    window.alert(`${omsText("uploadFileError")}: ${error.message || error}`);
                    if (onComplete) onComplete(error.message || String(error));
                } finally {
                    hideOmsLoading();
                    input.remove();
                }
            };
            input.click();
        }

        function openProjectDocumentUpload(projectUuid, docType, onComplete) {
            uploadWithDialog(".pdf,.xls,.xlsx,.jpg,.jpeg,.png", omsApiUrl(`/projects/${projectUuid}/documents`), { docType }, omsText("documentUploaded"), onComplete);
        }

        function openInspectionPhotoUpload(reportUuid) {
            uploadWithDialog("image/jpeg,image/png,image/webp", omsApiUrl(`/inspection-reports/${reportUuid}/photos`), {}, omsText("photoUploaded"));
        }

        function openFinancialImport(projectUuid, onComplete) {
            uploadWithDialog(
                ".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                omsApiUrl(`/projects/${projectUuid}/financials/import`),
                {},
                omsText("financialImported"),
                onComplete,
                omsText("importingFinancial")
            );
        }

        function downloadFinancialExport(projectUuid) {
            window.location.assign(omsApiUrl(`/projects/${projectUuid}/financials/export`));
        }

        let ufsiPendingInspectionPhotos = [];
        let ufsiPendingInspectionPhotoUrls = new WeakMap();

        function pendingInspectionPhotoUrl(file) {
            let url = ufsiPendingInspectionPhotoUrls.get(file);
            if (!url) {
                url = URL.createObjectURL(file);
                ufsiPendingInspectionPhotoUrls.set(file, url);
            }
            return url;
        }

        function releasePendingInspectionPhoto(file) {
            const url = ufsiPendingInspectionPhotoUrls.get(file);
            if (url) URL.revokeObjectURL(url);
            ufsiPendingInspectionPhotoUrls.delete(file);
        }

        function hidePendingInspectionPhotoPreviews() {
            const pane = document.getElementById("inspection-photo-preview-pane");
            if (pane) {
                pane.classList.remove("visible");
                pane.replaceChildren();
            }
        }

        function showPendingInspectionPhotoPreviews(onSelectionChanged) {
            const pane = document.getElementById("inspection-photo-preview-pane");
            if (!pane) return;
            pane.replaceChildren();
            if (!ufsiPendingInspectionPhotos.length) return hidePendingInspectionPhotoPreviews();
            pane.classList.add("visible");
            ufsiPendingInspectionPhotos.forEach((file, index) => {
                const card = document.createElement("div");
                card.className = "inspection-photo-preview";
                const image = document.createElement("img");
                image.src = pendingInspectionPhotoUrl(file);
                image.alt = file.name;
                const remove = document.createElement("button");
                remove.type = "button";
                remove.className = "inspection-photo-remove";
                remove.textContent = "×";
                remove.setAttribute("aria-label", `${omsText("remove")} ${file.name}`);
                remove.onclick = () => {
                    const [removed] = ufsiPendingInspectionPhotos.splice(index, 1);
                    if (removed) releasePendingInspectionPhoto(removed);
                    onSelectionChanged(ufsiPendingInspectionPhotos.length);
                };
                const name = document.createElement("span");
                name.textContent = file.name;
                card.append(image, remove, name);
                pane.append(card);
            });
        }

        function openInspectionPhotoPicker(onSelectionChanged) {
            const overlay = document.createElement("div");
            overlay.className = "inspection-photo-picker";
            const dialog = document.createElement("section");
            dialog.className = "inspection-photo-picker-dialog";
            const title = document.createElement("h2");
            title.textContent = omsText("photoTitle");
            const rules = document.createElement("p");
            rules.textContent = omsText("photoRules");
            const error = document.createElement("div");
            error.className = "inspection-photo-picker-error";
            const dropZone = document.createElement("button");
            dropZone.type = "button";
            dropZone.className = "inspection-photo-drop-zone";
            dropZone.textContent = omsText("photoDrop");
            const input = document.createElement("input");
            input.type = "file";
            input.accept = "image/jpeg,image/png,.jpg,.jpeg,.png";
            input.multiple = true;
            input.hidden = true;
            const previews = document.createElement("div");
            previews.className = "inspection-photo-previews";
            const done = document.createElement("button");
            done.type = "button";
            done.className = "inspection-photo-done";
            done.textContent = omsText("done");

            const notify = () => onSelectionChanged(ufsiPendingInspectionPhotos.length);
            const render = () => {
                previews.replaceChildren();
                ufsiPendingInspectionPhotos.forEach((file, index) => {
                    const card = document.createElement("div");
                    card.className = "inspection-photo-preview";
                    const image = document.createElement("img");
                    image.src = pendingInspectionPhotoUrl(file);
                    image.alt = file.name;
                    const remove = document.createElement("button");
                    remove.type = "button";
                    remove.className = "inspection-photo-remove";
                    remove.textContent = "×";
                    remove.setAttribute("aria-label", `${omsText("remove")} ${file.name}`);
                    remove.onclick = () => { const [removed] = ufsiPendingInspectionPhotos.splice(index, 1); if (removed) releasePendingInspectionPhoto(removed); notify(); render(); };
                    const name = document.createElement("span");
                    name.textContent = file.name;
                    card.append(image, remove, name);
                    previews.append(card);
                });
            };
            const addFiles = files => {
                const candidates = Array.from(files || []);
                const invalid = candidates.find(file => !["image/jpeg", "image/png"].includes(file.type) || file.size > 10_000_000);
                if (invalid) { error.textContent = `${invalid.name}: ${omsText("invalidPhoto")}`; return; }
                if (ufsiPendingInspectionPhotos.length + candidates.length > 30) { error.textContent = omsText("maxPhotos"); return; }
                error.textContent = "";
                ufsiPendingInspectionPhotos.push(...candidates);
                notify(); render();
            };
            dropZone.onclick = () => input.click();
            input.onchange = () => { addFiles(input.files); input.value = ""; };
            ["dragenter", "dragover"].forEach(event => dropZone.addEventListener(event, value => { value.preventDefault(); dropZone.classList.add("dragging"); }));
            ["dragleave", "drop"].forEach(event => dropZone.addEventListener(event, value => { value.preventDefault(); dropZone.classList.remove("dragging"); }));
            dropZone.addEventListener("drop", event => addFiles(event.dataTransfer.files));
            done.onclick = () => overlay.remove();
            overlay.onclick = event => { if (event.target === overlay) overlay.remove(); };
            dialog.append(title, rules, error, dropZone, input, previews, done);
            overlay.append(dialog);
            document.body.append(overlay);
            render();
        }

        async function uploadSelectedInspectionPhotos(reportUuid, onComplete) {
            showOmsLoading(omsText("uploadingFile"));
            try {
                for (const file of ufsiPendingInspectionPhotos) {
                    const formData = new FormData();
                    formData.append("file", file, file.name);
                    const response = await fetch(omsApiUrl(`/inspection-reports/${reportUuid}/photos`), { method: "POST", body: formData, credentials: "include" });
                    if (!response.ok) throw new Error(await response.text());
                }
                ufsiPendingInspectionPhotos.forEach(releasePendingInspectionPhoto);
                ufsiPendingInspectionPhotos = [];
                onComplete("");
            } catch (error) {
                onComplete(error.message || String(error));
            } finally {
                hideOmsLoading();
            }
        }

        function hideDashboardPhotoSlider() {
            const pane = document.getElementById("dashboard-photo-slider");
            if (pane) pane.classList.remove("visible");
        }

        function showDashboardPhotoSlider(inspectionDate, inspectionCode, photosJson) {
            const pane = document.getElementById("dashboard-photo-slider");
            if (!pane) return;
            const photos = JSON.parse(photosJson);
            pane.replaceChildren();
            pane.classList.add("visible");

            const title = document.createElement("div");
            title.className = "photo-slider-title";
            title.textContent = inspectionDate
                ? `${omsText("lastInspection")}: ${formatOmsDate(inspectionDate)}${inspectionCode ? ` · ${omsText("inspectionCode")}: ${inspectionCode}` : ""}`
                : omsText("noReports");
            pane.append(title);
            if (!inspectionDate) return;

            if (!photos.length) {
                const empty = document.createElement("div");
                empty.className = "photo-slider-empty";
                empty.textContent = omsText("noPhotos");
                pane.append(empty);
                return;
            }

            const track = document.createElement("div");
            track.className = "photo-slider-track";
            photos.forEach(photo => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "photo-slider-item";
                button.setAttribute("aria-label", `${omsText("open")} ${photo.fileName}`);
                const image = document.createElement("img");
                image.alt = photo.fileName;
                image.loading = "lazy";
                image.addEventListener("error", () => {
                    if (image.dataset.originalAttempted !== "true") {
                        image.dataset.originalAttempted = "true";
                        image.src = photo.downloadUrl;
                    } else {
                        image.remove();
                        button.classList.add("photo-slider-item-unavailable");
                        button.textContent = omsText("noPhotos");
                    }
                });
                image.src = photo.thumbnailUrl;
                button.append(image);
                button.addEventListener("click", () => openPhotoLightbox(photos, photo.uuid));
                track.append(button);
            });
            pane.append(track);
        }

        function openPhotoLightbox(photos, selectedUuid) {
            let index = Math.max(0, photos.findIndex(photo => photo.uuid === selectedUuid));
            const overlay = document.createElement("div");
            overlay.className = "photo-lightbox";
            overlay.addEventListener("click", event => { if (event.target === overlay) overlay.remove(); });
            const close = document.createElement("button");
            close.className = "photo-lightbox-close";
            close.textContent = "×";
            close.setAttribute("aria-label", omsText("closeFullscreenPhoto"));
            close.onclick = () => overlay.remove();
            const previous = document.createElement("button");
            previous.className = "photo-lightbox-nav previous";
            previous.textContent = "‹";
            const next = document.createElement("button");
            next.className = "photo-lightbox-nav next";
            next.textContent = "›";
            const image = document.createElement("img");
            image.className = "photo-lightbox-image";
            const caption = document.createElement("div");
            caption.className = "photo-lightbox-caption";
            image.onerror = () => {
                image.removeAttribute("src");
                image.alt = omsText("noPhotos");
                caption.textContent = omsText("noPhotos");
            };
            const render = () => { image.src = photos[index].downloadUrl; image.alt = photos[index].fileName; caption.textContent = `${photos[index].fileName} (${index + 1}/${photos.length})`; };
            previous.onclick = () => { index = (index - 1 + photos.length) % photos.length; render(); };
            next.onclick = () => { index = (index + 1) % photos.length; render(); };
            overlay.append(close, previous, image, next, caption);
            document.body.append(overlay);
            render();
        }

        function fitLeafletResults() {
            if (ufsiLeafletMap && ufsiMarkersLayer && ufsiMarkersLayer.getLayers().length) {
                ufsiLeafletMap.fitBounds(ufsiMarkersLayer.getBounds(), { padding: [40, 40], maxZoom: 13 });
            }
        }

        function setLeafletProjects(projectsJson) {
            initLeafletMap();

            if (!ufsiLeafletMap || !ufsiMarkersLayer) return;

            ufsiMarkersLayer.clearLayers();

            const projects = JSON.parse(projectsJson);

            if (!projects.length) {
                fitUkraineOverview();
                return;
            }

            const markerBounds = [];
            const coordinateUsage = new Map();
            projects.forEach(project => {
                const lat = project.latitude;
                const lng = project.longitude;
                const color = project.statusColor;
                const coordinateKey = `${lat.toFixed(6)},${lng.toFixed(6)}`;
                const duplicateIndex = coordinateUsage.get(coordinateKey) || 0;
                coordinateUsage.set(coordinateKey, duplicateIndex + 1);

                // User-provided names must be text, never interpreted as HTML.
                const popupHtml = document.createElement("div");
                popupHtml.className = "oms-map-preview";
                const name = document.createElement("strong");
                name.textContent = project.name;
                const region = document.createElement("p");
                region.textContent = project.regionLabel + ": " + project.region;
                const status = document.createElement("p");
                status.textContent = project.statusLabel + ": " + project.statusText;
                const open = document.createElement("button");
                open.type = "button";
                open.textContent = omsText("details");
                open.onclick = () => ufsiOnProjectClick && ufsiOnProjectClick(project.id);
                popupHtml.append(name, region, status, open);

                // Several facilities may share one postal address. Spread only
                // overlapping markers visually; their persisted GPS data remains exact.
                const radius = duplicateIndex === 0 ? 0 : 0.00018 * (1 + Math.floor((duplicateIndex - 1) / 6));
                const angle = duplicateIndex * (Math.PI * 2 / 6);
                const coordinates = [
                    lat + radius * Math.sin(angle),
                    lng + (radius * Math.cos(angle) / Math.cos(lat * Math.PI / 180))
                ];
                markerBounds.push(coordinates);
                L.marker(coordinates, {
                    icon: L.divIcon({
                        html: `<span class="oms-project-marker" style="--marker-color: ${color}"></span>`,
                        className: "",
                        iconSize: L.point(18, 18),
                        iconAnchor: L.point(9, 9)
                    })
                })
                    .bindPopup(popupHtml, {
                        autoPan: true,
                        keepInView: true,
                        autoPanPaddingTopLeft: [24, 24],
                        autoPanPaddingBottomRight: [24, 24],
                        maxWidth: 340,
                        minWidth: 220
                    })
                    .addTo(ufsiMarkersLayer);
            });

            // The map is an overview: opening it and changing filters must not
            // unexpectedly zoom into a single oblast or a group of facilities.
            // Wait until Compose has made the map host visible.  Without this second
            // pass Leaflet can retain a zoom calculated while the host had no width.
            setTimeout(fitUkraineOverview, 0);
        }

        window.addEventListener("load", () => {
            initLeafletMap();
        });
    </script>
</head>
<body>
<div id="app-shell">
    <div id="compose-host"></div>
    <section id="dashboard-photo-slider" aria-live="polite"></section>
    <section id="inspection-photo-preview-pane" aria-live="polite"></section>
    <div id="map-pane">
        <div id="map-host"></div>
    </div>
</div>
<!--suppress HtmlUnknownTarget -->
<script type="application/javascript" src="composeApp.js"></script>
</body>
</html>
