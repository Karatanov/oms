<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ufsi</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
    <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Глобальний інстанс карти.
        let ufsiLeafletMap = null;

        // Окремий шар для маркерів, щоб їх можна було легко оновлювати.
        let ufsiMarkersLayer = null;

        // Географічні межі України:
        // [південний-захід, північний-схід]
        const ukraineBounds = [
            [44.0, 22.0],
            [52.5, 40.5]
        ];

        function initLeafletMap() {
            const mapHost = document.getElementById("map-host");
            if (!mapHost || ufsiLeafletMap) return;

            // Створюємо карту.
            ufsiLeafletMap = L.map("map-host", {
                zoomControl: true,
                minZoom: 5,
                maxZoom: 18,
                maxBounds: ukraineBounds,
                maxBoundsViscosity: 1.0
            });

            // Додаємо базовий шар OpenStreetMap.
            L.tileLayer(
                "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                {
                    attribution: "&copy; OpenStreetMap contributors"
                }
            ).addTo(ufsiLeafletMap);

            // Створюємо окрему групу для маркерів.
            ufsiMarkersLayer = L.layerGroup().addTo(ufsiLeafletMap);

            // Одразу показуємо всю Україну.
            ufsiLeafletMap.fitBounds(ukraineBounds);
        }

        function showLeafletMapPane() {
            document.body.classList.add("map-visible");
            initLeafletMap();

            setTimeout(() => {
                if (ufsiLeafletMap) {
                    // Після показу контейнера перевираховуємо розмір карти.
                    ufsiLeafletMap.invalidateSize();

                    // І ще раз ставимо карту на всю Україну.
                    ufsiLeafletMap.fitBounds(ukraineBounds);
                }
            }, 250);
        }

        function hideLeafletMapPane() {
            document.body.classList.remove("map-visible");
        }

        function setLeafletProjects(projectsJson) {
            initLeafletMap();

            // Якщо карта або шар ще не готові — просто виходимо.
            if (!ufsiLeafletMap || !ufsiMarkersLayer) return;

            // Очищаємо попередні маркери перед новим малюванням.
            ufsiMarkersLayer.clearLayers();

            // Перетворюємо JSON-рядок у масив JS-об’єктів.
            const projects = JSON.parse(projectsJson);

            // Якщо список порожній — просто залишаємо карту на Україні.
            if (!projects.length) {
                ufsiLeafletMap.fitBounds(ukraineBounds);
                return;
            }

            projects.forEach(project => {
                const lat = project.latitude;
                const lng = project.longitude;
                const color = project.statusColor;

                // Формуємо текст popup.
                const popupHtml = `
                    <div>
                        <strong>${project.name}</strong><br/>
                        Region: ${project.region}<br/>
                        Status: ${project.statusText}
                    </div>
                `;

                // Малюємо круглий маркер у кольорі статусу.
                L.circleMarker([lat, lng], {
                    radius: 9,
                    color: color,
                    weight: 3,
                    fillColor: color,
                    fillOpacity: 0.85
                })
                    .bindPopup(popupHtml)
                    .addTo(ufsiMarkersLayer);
            });

            // Залишаємо загальний огляд України.
            ufsiLeafletMap.fitBounds(ukraineBounds);
        }

        window.addEventListener("load", () => {
            initLeafletMap();
        });
    </script>
</head>
<body>
<div id="app-shell">
    <div id="compose-host"></div>
    <div id="map-pane">
        <div id="map-host"></div>
    </div>
</div>
<script type="application/javascript" src="composeApp.js"></script>
</body>
</html>
