<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ufsi</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
    <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let ufsiLeafletMap = null;
        let ufsiMarkersLayer = null;
        let ufsiOnProjectClick = null;

        const ukraineBounds = [
            [44.0, 22.0],
            [52.5, 40.5]
        ];

        function initLeafletMap() {
            const mapHost = document.getElementById("map-host");
            if (!mapHost || ufsiLeafletMap) return;

            ufsiLeafletMap = L.map("map-host", {
                zoomControl: true,
                minZoom: 5,
                maxZoom: 18,
                maxBounds: ukraineBounds,
                maxBoundsViscosity: 1.0
            });

            L.tileLayer(
                "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                {
                    attribution: "&copy; OpenStreetMap contributors"
                }
            ).addTo(ufsiLeafletMap);

            ufsiMarkersLayer = L.layerGroup().addTo(ufsiLeafletMap);
            ufsiLeafletMap.fitBounds(ukraineBounds);
        }

        function showLeafletMapPane() {
            document.body.classList.add("map-visible");
            initLeafletMap();

            setTimeout(() => {
                if (ufsiLeafletMap) {
                    ufsiLeafletMap.invalidateSize();
                }
            }, 250);
        }

        function hideLeafletMapPane() {
            document.body.classList.remove("map-visible");
        }

        function setLeafletProjectClickHandler(handler) {
            ufsiOnProjectClick = handler;
        }

        function openSirImportDialog(projectUuid) {
            const input = document.createElement("input");
            input.type = "file";
            input.accept = ".xls,.xlsx,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
            input.onchange = async () => {
                const file = input.files && input.files[0];
                if (!file) return;
                const formData = new FormData();
                formData.append("file", file, file.name);
                try {
                    const response = await fetch(`http://localhost:8080/api/v1/projects/${projectUuid}/inspection-reports/import`, {
                        method: "POST",
                        body: formData,
                        credentials: "include"
                    });
                    if (!response.ok) throw new Error(await response.text());
                    window.location.reload();
                } catch (error) {
                    window.alert(`Could not import inspection report: ${error.message || error}`);
                }
            };
            input.click();
        }

        function uploadWithDialog(accept, url, extraFields, successMessage) {
            const input = document.createElement("input");
            input.type = "file";
            input.accept = accept;
            input.onchange = async () => {
                const file = input.files && input.files[0];
                if (!file) return;
                const formData = new FormData();
                Object.entries(extraFields).forEach(([key, value]) => formData.append(key, value));
                formData.append("file", file, file.name);
                try {
                    const response = await fetch(url, { method: "POST", body: formData, credentials: "include" });
                    if (!response.ok) throw new Error(await response.text());
                    window.alert(successMessage);
                    window.location.reload();
                } catch (error) {
                    window.alert(`Upload failed: ${error.message || error}`);
                }
            };
            input.click();
        }

        function openProjectDocumentUpload(projectUuid, docType) {
            uploadWithDialog(".pdf,.xlsx,.jpg,.jpeg,.png", `http://localhost:8080/api/v1/projects/${projectUuid}/documents`, { docType }, "Document uploaded successfully.");
        }

        function openInspectionPhotoUpload(reportUuid) {
            uploadWithDialog("image/jpeg,image/png,image/webp", `http://localhost:8080/api/v1/inspection-reports/${reportUuid}/photos`, {}, "Photo uploaded successfully.");
        }

        let ufsiPendingInspectionPhotos = [];

        function openInspectionPhotoPicker(onSelectionChanged) {
            const overlay = document.createElement("div");
            overlay.className = "inspection-photo-picker";
            const dialog = document.createElement("section");
            dialog.className = "inspection-photo-picker-dialog";
            const title = document.createElement("h2");
            title.textContent = "Inspection photos";
            const rules = document.createElement("p");
            rules.textContent = "Drag photos here or select files. JPEG/PNG only, up to 10 MB each, maximum 30 photos.";
            const error = document.createElement("div");
            error.className = "inspection-photo-picker-error";
            const dropZone = document.createElement("button");
            dropZone.type = "button";
            dropZone.className = "inspection-photo-drop-zone";
            dropZone.textContent = "Drop photos here or click to select";
            const input = document.createElement("input");
            input.type = "file";
            input.accept = "image/jpeg,image/png,.jpg,.jpeg,.png";
            input.multiple = true;
            input.hidden = true;
            const previews = document.createElement("div");
            previews.className = "inspection-photo-previews";
            const done = document.createElement("button");
            done.type = "button";
            done.className = "inspection-photo-done";
            done.textContent = "Done";

            const notify = () => onSelectionChanged(ufsiPendingInspectionPhotos.length);
            const render = () => {
                previews.replaceChildren();
                ufsiPendingInspectionPhotos.forEach((file, index) => {
                    const card = document.createElement("div");
                    card.className = "inspection-photo-preview";
                    const image = document.createElement("img");
                    image.src = URL.createObjectURL(file);
                    image.alt = file.name;
                    const remove = document.createElement("button");
                    remove.type = "button";
                    remove.className = "inspection-photo-remove";
                    remove.textContent = "×";
                    remove.setAttribute("aria-label", `Remove ${file.name}`);
                    remove.onclick = () => { ufsiPendingInspectionPhotos.splice(index, 1); notify(); render(); };
                    const name = document.createElement("span");
                    name.textContent = file.name;
                    card.append(image, remove, name);
                    previews.append(card);
                });
            };
            const addFiles = files => {
                const candidates = Array.from(files || []);
                const invalid = candidates.find(file => !["image/jpeg", "image/png"].includes(file.type) || file.size > 10_000_000);
                if (invalid) { error.textContent = `${invalid.name}: JPEG/PNG files up to 10 MB are allowed.`; return; }
                if (ufsiPendingInspectionPhotos.length + candidates.length > 30) { error.textContent = "You can attach a maximum of 30 photos."; return; }
                error.textContent = "";
                ufsiPendingInspectionPhotos.push(...candidates);
                notify(); render();
            };
            dropZone.onclick = () => input.click();
            input.onchange = () => { addFiles(input.files); input.value = ""; };
            ["dragenter", "dragover"].forEach(event => dropZone.addEventListener(event, value => { value.preventDefault(); dropZone.classList.add("dragging"); }));
            ["dragleave", "drop"].forEach(event => dropZone.addEventListener(event, value => { value.preventDefault(); dropZone.classList.remove("dragging"); }));
            dropZone.addEventListener("drop", event => addFiles(event.dataTransfer.files));
            done.onclick = () => overlay.remove();
            overlay.onclick = event => { if (event.target === overlay) overlay.remove(); };
            dialog.append(title, rules, error, dropZone, input, previews, done);
            overlay.append(dialog);
            document.body.append(overlay);
            render();
        }

        async function uploadSelectedInspectionPhotos(reportUuid, onComplete) {
            try {
                for (const file of ufsiPendingInspectionPhotos) {
                    const formData = new FormData();
                    formData.append("file", file, file.name);
                    const response = await fetch(`http://localhost:8080/api/v1/inspection-reports/${reportUuid}/photos`, { method: "POST", body: formData, credentials: "include" });
                    if (!response.ok) throw new Error(await response.text());
                }
                ufsiPendingInspectionPhotos = [];
                onComplete("");
            } catch (error) {
                onComplete(error.message || String(error));
            }
        }

        function hideDashboardPhotoSlider() {
            const pane = document.getElementById("dashboard-photo-slider");
            if (pane) pane.classList.remove("visible");
        }

        function showDashboardPhotoSlider(inspectionDate, photosJson) {
            const pane = document.getElementById("dashboard-photo-slider");
            if (!pane) return;
            const photos = JSON.parse(photosJson);
            pane.replaceChildren();
            pane.classList.add("visible");

            const title = document.createElement("div");
            title.className = "photo-slider-title";
            title.textContent = inspectionDate ? `Latest inspection: ${inspectionDate}` : "No Inspection Reports yet";
            pane.append(title);
            if (!inspectionDate) return;

            if (!photos.length) {
                const empty = document.createElement("div");
                empty.className = "photo-slider-empty";
                empty.textContent = "No photos in the latest inspection.";
                pane.append(empty);
                return;
            }

            const track = document.createElement("div");
            track.className = "photo-slider-track";
            photos.forEach(photo => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "photo-slider-item";
                button.setAttribute("aria-label", `Open ${photo.fileName}`);
                const image = document.createElement("img");
                image.src = photo.thumbnailUrl;
                image.alt = photo.fileName;
                image.loading = "lazy";
                button.append(image);
                button.addEventListener("click", () => openPhotoLightbox(photos, photo.uuid));
                track.append(button);
            });
            pane.append(track);
        }

        function openPhotoLightbox(photos, selectedUuid) {
            let index = Math.max(0, photos.findIndex(photo => photo.uuid === selectedUuid));
            const overlay = document.createElement("div");
            overlay.className = "photo-lightbox";
            overlay.addEventListener("click", event => { if (event.target === overlay) overlay.remove(); });
            const close = document.createElement("button");
            close.className = "photo-lightbox-close";
            close.textContent = "×";
            close.setAttribute("aria-label", "Close full-screen photo");
            close.onclick = () => overlay.remove();
            const previous = document.createElement("button");
            previous.className = "photo-lightbox-nav previous";
            previous.textContent = "‹";
            const next = document.createElement("button");
            next.className = "photo-lightbox-nav next";
            next.textContent = "›";
            const image = document.createElement("img");
            image.className = "photo-lightbox-image";
            const caption = document.createElement("div");
            caption.className = "photo-lightbox-caption";
            const render = () => { image.src = photos[index].downloadUrl; image.alt = photos[index].fileName; caption.textContent = `${photos[index].fileName} (${index + 1}/${photos.length})`; };
            previous.onclick = () => { index = (index - 1 + photos.length) % photos.length; render(); };
            next.onclick = () => { index = (index + 1) % photos.length; render(); };
            overlay.append(close, previous, image, next, caption);
            document.body.append(overlay);
            render();
        }

        function setLeafletProjects(projectsJson) {
            initLeafletMap();

            if (!ufsiLeafletMap || !ufsiMarkersLayer) return;

            ufsiMarkersLayer.clearLayers();

            const projects = JSON.parse(projectsJson);

            if (!projects.length) {
                ufsiLeafletMap.fitBounds(ukraineBounds);
                return;
            }

            const markerBounds = [];
            projects.forEach(project => {
                const lat = project.latitude;
                const lng = project.longitude;
                const color = project.statusColor;

                const popupHtml = `
                <div style="min-width: 180px;">
                    <strong>${project.name}</strong><br/>
                    ${project.regionLabel}: ${project.region}<br/>
                    ${project.statusLabel}: ${project.statusText}<br/><br/>
                    <button
                        type="button"
                        onclick="ufsiOnProjectClick && ufsiOnProjectClick('${project.id}')"
                        style="
                            width: 100%;
                            padding: 8px 12px;
                            border: none;
                            border-radius: 8px;
                            cursor: pointer;
                            background: #278DAD;
                            color: white;
                            font-weight: 600;
                        "
                    >
                        Деталі
                    </button>
                </div>
            `;

                const coordinates = [lat, lng];
                markerBounds.push(coordinates);
                L.circleMarker(coordinates, {
                    radius: 9,
                    color: color,
                    weight: 3,
                    fillColor: color,
                    fillOpacity: 0.85
                })
                    .bindPopup(popupHtml)
                    .addTo(ufsiMarkersLayer);
            });

            if (markerBounds.length === 1) {
                ufsiLeafletMap.setView(markerBounds[0], 13);
            } else {
                ufsiLeafletMap.fitBounds(markerBounds, {
                    padding: [48, 48],
                    maxZoom: 16
                });
            }
        }

        window.addEventListener("load", () => {
            initLeafletMap();
        });
    </script>
</head>
<body>
<div id="app-shell">
    <div id="compose-host"></div>
    <section id="dashboard-photo-slider" aria-live="polite"></section>
    <div id="map-pane">
        <div id="map-host"></div>
    </div>
</div>
<!--suppress HtmlUnknownTarget -->
<script type="application/javascript" src="composeApp.js"></script>
</body>
</html>
