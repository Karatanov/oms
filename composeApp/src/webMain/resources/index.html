<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMITAF</title>
    <link type="text/css" rel="stylesheet" href="styles.css?v=20260921-report-preview-hit-test">
    <script src="auth.js?v=20260925-safari"></script>
    <script>
        function omsApiUrl(path) {
            const local = ["localhost", "127.0.0.1"].includes(window.location.hostname);
            // The published SPA lives on GitHub Pages while the API remains
            // on Render. Native upload/download helpers use this function,
            // so it must follow the same cross-origin rule as Kotlin code.
            const pages = window.location.hostname === "karatanov.github.io";
            const base = pages
                ? "https://oms-3j46.onrender.com/api/v1"
                : local && window.location.port === "8081"
                    ? `${window.location.protocol}//${window.location.hostname}:8080/api/v1`
                    : "/api/v1";
            return `${base}${path}`;
        }

        let umitafLeafletMap = null;
        let umitafMarkersLayer = null;
        let umitafOnProjectClick = null;
        let umitafLeafletLoading = null;
        let omsLanguage = "uk";
        const omsBrowserStrings = {
            uk: {
                importReportError: "Не вдалося імпортувати інспекційний звіт",
                uploadFileError: "Не вдалося завантажити файл",
                documentUploaded: "Документ успішно завантажено.", photoUploaded: "Фото успішно завантажено.", sirSourceReplaced: "Вихідний файл SIR успішно замінено.",
                financialImported: "Фінансові записи успішно імпортовано.", photoTitle: "Фотографії інспекції",
                photoRules: "Перетягніть фотографії сюди або виберіть файли. Лише JPEG/PNG, до 10 МБ кожен, максимум 30 фотографій.",
                photoDrop: "Перетягніть фотографії сюди або натисніть для вибору", done: "Готово", remove: "Видалити",
                invalidPhoto: "дозволені лише JPEG/PNG-файли розміром до 10 МБ.", maxPhotos: "Можна прикріпити максимум 30 фотографій.",
                lastInspection: "Остання інспекція", inspectionCode: "Код інспекції", subprojectCode: "Код субпроєкту", noReports: "Інспекційних звітів ще немає", noPhotos: "В останній інспекції немає фотографій.",
                open: "Відкрити", previewReport: "Переглянути звіт", closeFullscreenPhoto: "Закрити повноекранне фото", details: "Деталі",
                loading: "Завантаження даних…", uploadingFile: "Завантаження файлу…", importingInspection: "Імпорт інспекційного звіту…", importingFinancial: "Імпорт фінансових записів…",
                pasteTruncated: "Текст не вставлено: максимум {limit} символів за раз. Вставте менший фрагмент."
            },
            en: {
                importReportError: "Could not import inspection report", uploadFileError: "Could not upload file",
                documentUploaded: "Document uploaded successfully.", photoUploaded: "Photo uploaded successfully.", sirSourceReplaced: "The SIR source file was replaced successfully.",
                financialImported: "Financial records imported successfully.", photoTitle: "Inspection photos",
                photoRules: "Drag photos here or choose files. JPEG/PNG only, up to 10 MB each, maximum 30 photos.",
                photoDrop: "Drag photos here or click to select", done: "Done", remove: "Remove",
                invalidPhoto: "only JPEG/PNG files up to 10 MB are allowed.", maxPhotos: "You can attach up to 30 photos.",
                lastInspection: "Latest inspection", inspectionCode: "Inspection code", subprojectCode: "Subproject code", noReports: "No Inspection Reports yet", noPhotos: "No photos in the latest inspection.",
                open: "Open", previewReport: "Preview report", closeFullscreenPhoto: "Close full-screen photo", details: "Details",
                loading: "Loading data…", uploadingFile: "Uploading file…", importingInspection: "Importing inspection report…", importingFinancial: "Importing financial records…",
                pasteTruncated: "Text was not pasted: maximum {limit} characters at a time. Paste a smaller fragment."
            }
        };
        function setOmsLanguage(language) { omsLanguage = language === "en" ? "en" : "uk"; }
        function omsText(key) { return omsBrowserStrings[omsLanguage][key] || omsBrowserStrings.uk[key] || key; }

        let omsLoadingRequests = 0;
        // Explicit native uploads/imports have non-blocking operation feedback.
        // This counter is never used for startup or route readiness.
        function showOmsLoading(message) {
            let overlay = document.getElementById("oms-operation-progress");
            if (!overlay) {
                overlay = document.createElement("div");
                overlay.id = "oms-operation-progress";
                overlay.innerHTML = '<div class="oms-loading-card"><span class="oms-loading-spinner"></span><span class="oms-loading-message"></span></div>';
                document.body.appendChild(overlay);
            }
            omsLoadingRequests += 1;
            overlay.querySelector(".oms-loading-message").textContent = message || omsText("loading");
            overlay.classList.add("visible");
        }

        function hideOmsLoading() {
            omsLoadingRequests = Math.max(0, omsLoadingRequests - 1);
            if (omsLoadingRequests === 0) document.getElementById("oms-operation-progress")?.classList.remove("visible");
        }

        function finishOmsStartup() {
            document.getElementById("oms-loading-overlay")?.classList.remove("visible");
            performance.mark("oms-dashboard-handoff");
        }

        function setOmsRouteTransition(busy, indicator, failed, english, requested, displayed, retry) {
            const pane = document.getElementById("oms-route-transition");
            if (!pane) return;
            pane.hidden = !busy;
            pane.dataset.requestedSection = requested;
            pane.dataset.displayedSection = displayed;
            pane.classList.toggle("indicating", busy && (indicator || failed));
            pane.setAttribute("aria-busy", String(busy && !failed));
            pane.querySelector(".oms-route-card").hidden = !busy || (!indicator && !failed);
            pane.querySelector(".oms-loading-spinner").hidden = failed;
            pane.querySelector(".oms-route-message").textContent = failed
                ? (english ? "Could not load this section. Please try again." : "Не вдалося завантажити розділ. Спробуйте ще раз.")
                : (english ? "Loading section…" : "Завантаження розділу…");
            const button = pane.querySelector("button");
            button.hidden = !failed;
            button.textContent = english ? "Retry" : "Повторити";
            button.onclick = retry;
            document.querySelectorAll("#map-pane, #dashboard-photo-slider, .inspection-photo-preview-pane")
                .forEach(element => { element.inert = busy; });
        }

        // Compose/Wasm receives the complete ClipboardEvent before individual
        // Kotlin field limits run. Extremely large text can lock the UI before
        // an onValueChange handler has a chance to limit it.
        const omsMaximumPasteLength = 12_000;
        let omsPasteNoticeTimer = null;

        function showOmsPasteNotice() {
            let notice = document.getElementById("oms-paste-notice");
            if (!notice) {
                notice = document.createElement("div");
                notice.id = "oms-paste-notice";
                notice.setAttribute("role", "status");
                notice.setAttribute("aria-live", "polite");
                document.body.appendChild(notice);
            }
            notice.textContent = omsText("pasteTruncated").replace("{limit}", omsMaximumPasteLength.toLocaleString());
            notice.classList.add("visible");
            clearTimeout(omsPasteNoticeTimer);
            omsPasteNoticeTimer = setTimeout(() => notice.classList.remove("visible"), 4500);
        }

        window.addEventListener("paste", event => {
            const text = event.clipboardData?.getData("text/plain") || "";

            // Let the browser and Compose handle every normal paste natively.
            // Re-dispatching a synthetic ClipboardEvent into Compose/Wasm is
            // unsafe: a context-menu paste can enter its event loop twice and
            // freeze the entire form. Only reject an actually oversized paste.
            if (text.length <= omsMaximumPasteLength) return;
            event.preventDefault();
            event.stopImmediatePropagation();
            showOmsPasteNotice();
        }, true);

        function formatDateForInput(epochMillis) {
            const date = new Date(epochMillis);
            const year = date.getUTCFullYear();
            const month = String(date.getUTCMonth() + 1).padStart(2, "0");
            const day = String(date.getUTCDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        function currentIsoDate() {
            const date = new Date();
            const local = new Date(date.getTime() - date.getTimezoneOffset() * 60_000);
            return local.toISOString().slice(0, 10);
        }

        function daysBetweenIsoDates(start, end) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(start || "") || !/^\d{4}-\d{2}-\d{2}$/.test(end || "")) return null;
            const startMs = Date.parse(start + "T00:00:00Z");
            const endMs = Date.parse(end + "T00:00:00Z");
            const days = Math.round((endMs - startMs) / 86400000);
            return days >= 0 ? days : null;
        }

        // Browser-native date input is dependable in Wasm and provides a calendar on desktop/mobile.
        function openNativeDatePicker(value, anchorLeft, anchorTop, onSelected) {
            if (window.omsCloseDatePicker) window.omsCloseDatePicker();
            const input = document.createElement("input");
            input.className = "oms-native-date-input";
            input.type = "date";
            input.value = /^\d{4}-\d{2}-\d{2}$/.test(value || "") ? value : currentIsoDate();
            input.style.position = "fixed";
            // Compose/Wasm controls do not reliably become document.activeElement.
            // Position the native input from the measured calendar-button coordinates instead.
            const left = Math.max(12, Math.min(Number(anchorLeft) || 16, window.innerWidth - 280));
            const top = Math.max(12, Math.min(Number(anchorTop) || 16, window.innerHeight - 40));
            input.style.left = `${left}px`;
            input.style.top = `${top}px`;
            input.style.width = "180px";
            input.style.height = "36px";
            input.style.boxSizing = "border-box";
            input.style.zIndex = "2147483647";
            input.style.background = "white";
            input.style.color = "#172b35";
            input.style.border = "1px solid #278DAD";
            input.style.borderRadius = "6px";
            document.body.appendChild(input);
            const remove = () => {
                input.remove();
                window.removeEventListener("resize", remove);
                window.removeEventListener("scroll", remove, true);
                window.removeEventListener("wheel", remove, true);
                if (window.omsCloseDatePicker === remove) window.omsCloseDatePicker = null;
            };
            window.omsCloseDatePicker = remove;
            window.addEventListener("resize", remove);
            window.addEventListener("scroll", remove, true);
            window.addEventListener("wheel", remove, true);
            input.addEventListener("keydown", event => { if (event.key === "Escape") remove(); });
            input.addEventListener("change", () => { if (input.value) onSelected(input.value); remove(); }, { once: true });
            input.addEventListener("blur", () => setTimeout(remove, 100), { once: true });
            input.focus({ preventScroll: true });
            // Safari versions without showPicker retain a visible, usable date input.
            try { if (typeof input.showPicker === "function") input.showPicker(); }
            catch (_) { /* Native date input remains available for keyboard/click. */ }
        }

        function formatOmsDate(value) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(value || "")) return value || "";
            const [year, month, day] = value.split("-");
            return `${day}.${month}.${year}`;
        }

        function formatOmsDateTime(value) {
            if (!value) return "";
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return value;
            return new Intl.DateTimeFormat(omsLanguage === "en" ? "en-GB" : "uk-UA", {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            }).format(date);
        }

        const ukraineBounds = [
            [44.0, 22.0],
            [52.5, 40.5]
        ];

        // Leaflet is used only by the map screen. Keeping third-party scripts out
        // of startup prevents a CDN delay from blocking the entire Compose app.
        function loadScript(url) {
            return new Promise((resolve, reject) => {
                const script = document.createElement("script");
                script.src = url;
                script.async = true;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        function loadStyle(url) {
            return new Promise((resolve, reject) => {
                if (document.querySelector(`link[href="${url}"]`)) { resolve(); return; }
                const link = document.createElement("link");
                link.rel = "stylesheet";
                link.href = url;
                link.onload = resolve;
                link.onerror = reject;
                document.head.appendChild(link);
            });
        }

        function ensureLeafletLoaded() {
            if (window.L && typeof L.map === "function" && typeof L.markerClusterGroup === "function") {
                return Promise.resolve(true);
            }
            if (umitafLeafletLoading) return umitafLeafletLoading;
            umitafLeafletLoading = Promise.all([
                loadStyle("https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"),
                loadStyle("https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"),
                loadStyle("https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css")
            ]).then(() => loadScript("https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"))
                .then(() => loadScript("https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"))
                .then(() => true)
                .catch(() => false);
            return umitafLeafletLoading;
        }

        // Leaflet calculates the zoom from the current element size.  The map host is
        // hidden while the other screens are open, so fitting it only during
        // initialisation can calculate a zoom for a zero-sized element.  Always reset
        // the overview after the host becomes visible and has been measured.
        function fitUkraineOverview() {
            if (!umitafLeafletMap) return;
            umitafLeafletMap.invalidateSize();
            umitafLeafletMap.fitBounds(ukraineBounds, { padding: [24, 24] });
        }

        function initLeafletMap() {
            const mapHost = document.getElementById("map-host");
            if (!mapHost) return false;
            if (umitafLeafletMap) return true;
            if (!window.L || typeof L.map !== "function" || typeof L.markerClusterGroup !== "function") return false;

            umitafLeafletMap = L.map("map-host", {
                zoomControl: true,
                minZoom: 5,
                maxZoom: 18,
                maxBounds: ukraineBounds,
                maxBoundsViscosity: 1.0
            });

            L.tileLayer(
                "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                {
                    attribution: "&copy; OpenStreetMap contributors"
                }
            ).addTo(umitafLeafletMap);

            umitafMarkersLayer = L.markerClusterGroup({
                showCoverageOnHover: false,
                spiderfyOnMaxZoom: true,
                zoomToBoundsOnClick: true,
                maxClusterRadius: 58,
                iconCreateFunction: cluster => L.divIcon({
                    html: `<span>${cluster.getChildCount()}</span>`,
                    className: "oms-project-cluster",
                    iconSize: L.point(52, 52),
                    iconAnchor: L.point(26, 26)
                })
            }).addTo(umitafLeafletMap);
            fitUkraineOverview();
            return true;
        }

        function setOmsPaneBounds(id, x, y, width, height) {
            let pane = document.getElementById(id);
            if (!pane && (id.startsWith("inspection-photo-preview-pane-") || id.startsWith("inspection-report-photo-gallery-") || id.startsWith("inspection-activity-photo-gallery-"))) {
                pane = document.createElement("section");
                pane.id = id;
                pane.className = (id.startsWith("inspection-report-photo-gallery-") || id.startsWith("inspection-activity-photo-gallery-"))
                    ? "inspection-report-photo-gallery"
                    : "inspection-photo-preview-pane";
                pane.setAttribute("aria-live", "polite");
                document.body.appendChild(pane);
            }
            if (!pane) return;
            if (id !== "oms-route-transition") pane.inert = !document.getElementById("oms-route-transition")?.hidden;
            pane.classList.toggle("oms-pane-clipped", height <= 0 || width <= 0);
            Object.assign(pane.style, { left: x + "px", top: y + "px", width: width + "px", height: height + "px", right: "auto", bottom: "auto" });
            if (id === "map-pane" && umitafLeafletMap) umitafLeafletMap.invalidateSize({pan: false});
        }

        function setOmsCanvasOverlay(active) {
            document.body.classList.toggle("canvas-overlay-open", active);
        }

        function showLeafletMapPane() {
            document.body.classList.add("map-visible");
            ensureLeafletLoaded().then(loaded => {
                if (!loaded || !initLeafletMap()) return;
                setTimeout(fitUkraineOverview, 250);
            });
        }

        function hideLeafletMapPane() {
            document.body.classList.remove("map-visible");
        }

        function setLeafletProjectClickHandler(handler) {
            umitafOnProjectClick = handler;
        }

        function openSirImportDialog(projectUuid, onComplete) {
            const input = document.createElement("input");
            input.type = "file";
            input.accept = ".xls,.xlsx,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
            input.style.display = "none";
            document.body.appendChild(input);
            input.onchange = async () => {
                const file = input.files && input.files[0];
                if (!file) {
                    input.remove();
                    return;
                }
                const formData = new FormData();
                formData.append("file", file, file.name);
                showOmsLoading(omsText("importingInspection"));
                try {
                    const response = await omsAuthenticatedFetch(omsApiUrl(`/projects/${projectUuid}/inspection-reports/import`), {
                        method: "POST",
                        body: formData,
                        credentials: "include"
                    });
                    if (!response.ok) throw new Error(await response.text());
                    onComplete("");
                } catch (error) {
                    onComplete(error.message || String(error));
                } finally {
                    hideOmsLoading();
                    input.remove();
                }
            };
            input.click();
        }

        function uploadWithDialog(accept, url, extraFields, successMessage, onComplete = null, loadingMessage = omsText("uploadingFile"), method = "POST") {
            const input = document.createElement("input");
            input.type = "file";
            input.accept = accept;
            input.style.display = "none";
            document.body.appendChild(input);
            input.onchange = async () => {
                const file = input.files && input.files[0];
                if (!file) {
                    input.remove();
                    return;
                }
                const formData = new FormData();
                Object.entries(extraFields).forEach(([key, value]) => formData.append(key, value));
                formData.append("file", file, file.name);
                showOmsLoading(loadingMessage);
                try {
                    const response = await omsAuthenticatedFetch(url, { method, body: formData, credentials: "include" });
                    if (!response.ok) throw new Error(await response.text());
                    window.alert(successMessage);
                    if (onComplete) onComplete("");
                    else window.location.reload();
                } catch (error) {
                    window.alert(`${omsText("uploadFileError")}: ${error.message || error}`);
                    if (onComplete) onComplete(error.message || String(error));
                } finally {
                    hideOmsLoading();
                    input.remove();
                }
            };
            input.click();
        }

        function openProjectDocumentUpload(projectUuid, docType, onComplete) {
            uploadWithDialog(".pdf,.xls,.xlsx,.jpg,.jpeg,.png", omsApiUrl(`/projects/${projectUuid}/documents`), { docType }, omsText("documentUploaded"), onComplete);
        }

        function openInspectionPhotoUpload(reportUuid, onComplete = null) {
            uploadWithDialog("image/jpeg,image/png,image/webp", omsApiUrl(`/inspection-reports/${reportUuid}/photos`), {}, omsText("photoUploaded"), onComplete);
        }

        function openInspectionSourceReplacement(reportUuid, onComplete) {
            uploadWithDialog(
                ".xls,.xlsx,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                omsApiUrl(`/inspection-reports/${reportUuid}/source-file`),
                {},
                omsText("sirSourceReplaced"),
                onComplete,
                omsText("uploadingFile"),
                "PUT"
            );
        }

        function openFinancialImport(projectUuid, onComplete) {
            uploadWithDialog(
                ".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                omsApiUrl(`/projects/${projectUuid}/financials/import`),
                {},
                omsText("financialImported"),
                onComplete,
                omsText("importingFinancial")
            );
        }

        function downloadFinancialExport(projectUuid) {
            openOmsDownload(omsApiUrl(`/projects/${projectUuid}/financials/export`));
        }

        const umitafPendingInspectionPhotos = new Map();
        const umitafPendingInspectionPhotoDescriptions = new Map();
        let umitafPendingInspectionPhotoUrls = new WeakMap();
        const umitafPendingInspectionPreviewRequests = new Map();

        function pendingInspectionPhotos(activityKey) {
            if (!umitafPendingInspectionPhotos.has(activityKey)) umitafPendingInspectionPhotos.set(activityKey, []);
            return umitafPendingInspectionPhotos.get(activityKey);
        }

        function pendingInspectionPhotoTotal() {
            return Array.from(umitafPendingInspectionPhotos.values()).reduce((total, files) => total + files.length, 0);
        }

        function pendingInspectionPhotoPane(activityKey) {
            return document.getElementById(`inspection-photo-preview-pane-${activityKey}`);
        }

        function setPendingInspectionPhotoDescription(activityKey, description) {
            umitafPendingInspectionPhotoDescriptions.set(activityKey, String(description || "").trim());
        }

        function pendingInspectionPhotoUrl(file) {
            let url = umitafPendingInspectionPhotoUrls.get(file);
            if (!url) {
                url = URL.createObjectURL(file);
                umitafPendingInspectionPhotoUrls.set(file, url);
            }
            return url;
        }

        function releasePendingInspectionPhoto(file) {
            const url = umitafPendingInspectionPhotoUrls.get(file);
            if (url) URL.revokeObjectURL(url);
            umitafPendingInspectionPhotoUrls.delete(file);
        }

        function hidePendingInspectionPhotoPreviews(activityKey) {
            // Invalidate a queued layout-frame render before the native pane
            // disappears with its Compose anchor.
            umitafPendingInspectionPreviewRequests.set(activityKey, (umitafPendingInspectionPreviewRequests.get(activityKey) || 0) + 1);
            const pane = pendingInspectionPhotoPane(activityKey);
            if (pane) {
                pane.classList.remove("visible");
                pane.replaceChildren();
            }
        }

        function showPendingInspectionPhotoPreviews(activityKey, onSelectionChanged) {
            const requestId = (umitafPendingInspectionPreviewRequests.get(activityKey) || 0) + 1;
            umitafPendingInspectionPreviewRequests.set(activityKey, requestId);
            // The DOM pane is created by NativePaneAnchor after Compose has
            // laid out this frame. Render on the next frame so a newly picked
            // photo is visible immediately, rather than requiring reopening
            // the activity section.
            const render = (attempt = 0) => {
                if (umitafPendingInspectionPreviewRequests.get(activityKey) !== requestId) return;
                const pane = pendingInspectionPhotoPane(activityKey);
                if (!pane) {
                    if (attempt < 3) requestAnimationFrame(() => render(attempt + 1));
                    return;
                }
                pane.replaceChildren();
                const photos = pendingInspectionPhotos(activityKey);
                if (!photos.length) {
                    pane.classList.remove("visible");
                    return;
                }
                pane.classList.add("visible");
                const gallery = photos.map((file, photoIndex) => ({
                    uuid: `${activityKey}-${photoIndex}`,
                    fileName: file.name,
                    downloadUrl: pendingInspectionPhotoUrl(file)
                }));
                photos.forEach((file, index) => {
                const card = document.createElement("div");
                card.className = "inspection-photo-preview";
                card.tabIndex = 0;
                card.setAttribute("role", "button");
                card.setAttribute("aria-label", `${omsText("open")} ${file.name}`);
                const open = () => openPhotoLightbox(gallery, gallery[index].uuid);
                card.onclick = open;
                card.onkeydown = event => {
                    if (event.key === "Enter" || event.key === " ") { event.preventDefault(); open(); }
                };
                const image = document.createElement("img");
                image.src = pendingInspectionPhotoUrl(file);
                image.alt = file.name;
                const remove = document.createElement("button");
                remove.type = "button";
                remove.className = "inspection-photo-remove";
                remove.textContent = "×";
                remove.setAttribute("aria-label", `${omsText("remove")} ${file.name}`);
                remove.onclick = event => {
                    event.stopPropagation();
                    const [removed] = photos.splice(index, 1);
                    if (removed) releasePendingInspectionPhoto(removed);
                    onSelectionChanged(photos.length);
                };
                const name = document.createElement("span");
                name.textContent = file.name;
                card.append(image, remove, name);
                pane.append(card);
            });
            };
            requestAnimationFrame(() => render());
        }

        function openInspectionPhotoPicker(activityKey, onSelectionChanged) {
            const overlay = document.createElement("div");
            overlay.className = "inspection-photo-picker";
            const dialog = document.createElement("section");
            dialog.className = "inspection-photo-picker-dialog";
            const title = document.createElement("h2");
            title.textContent = omsText("photoTitle");
            const rules = document.createElement("p");
            rules.textContent = omsText("photoRules");
            const error = document.createElement("div");
            error.className = "inspection-photo-picker-error";
            const dropZone = document.createElement("button");
            dropZone.type = "button";
            dropZone.className = "inspection-photo-drop-zone";
            dropZone.textContent = omsText("photoDrop");
            const input = document.createElement("input");
            input.type = "file";
            input.accept = "image/jpeg,image/png,.jpg,.jpeg,.png";
            input.multiple = true;
            input.hidden = true;
            const previews = document.createElement("div");
            previews.className = "inspection-photo-previews";
            const done = document.createElement("button");
            done.type = "button";
            done.className = "inspection-photo-done";
            done.textContent = omsText("done");

            const photos = pendingInspectionPhotos(activityKey);
            const notify = () => onSelectionChanged(photos.length);
            const render = () => {
                previews.replaceChildren();
                const gallery = photos.map((file, photoIndex) => ({
                    uuid: `${activityKey}-${photoIndex}`,
                    fileName: file.name,
                    downloadUrl: pendingInspectionPhotoUrl(file)
                }));
                photos.forEach((file, index) => {
                    const card = document.createElement("div");
                    card.className = "inspection-photo-preview";
                    card.tabIndex = 0;
                    card.setAttribute("role", "button");
                    card.setAttribute("aria-label", `${omsText("open")} ${file.name}`);
                    const open = () => openPhotoLightbox(gallery, gallery[index].uuid);
                    card.onclick = open;
                    card.onkeydown = event => {
                        if (event.key === "Enter" || event.key === " ") { event.preventDefault(); open(); }
                    };
                    const image = document.createElement("img");
                    image.src = pendingInspectionPhotoUrl(file);
                    image.alt = file.name;
                    const remove = document.createElement("button");
                    remove.type = "button";
                    remove.className = "inspection-photo-remove";
                    remove.textContent = "×";
                    remove.setAttribute("aria-label", `${omsText("remove")} ${file.name}`);
                    remove.onclick = event => { event.stopPropagation(); const [removed] = photos.splice(index, 1); if (removed) releasePendingInspectionPhoto(removed); notify(); render(); };
                    const name = document.createElement("span");
                    name.textContent = file.name;
                    card.append(image, remove, name);
                    previews.append(card);
                });
            };
            const addFiles = files => {
                const candidates = Array.from(files || []);
                const invalid = candidates.find(file => !["image/jpeg", "image/png"].includes(file.type) || file.size > 10_000_000);
                if (invalid) { error.textContent = `${invalid.name}: ${omsText("invalidPhoto")}`; return; }
                if (pendingInspectionPhotoTotal() + candidates.length > 30) { error.textContent = omsText("maxPhotos"); return; }
                error.textContent = "";
                photos.push(...candidates);
                notify(); render();
            };
            dropZone.onclick = () => input.click();
            input.onchange = () => { addFiles(input.files); input.value = ""; };
            ["dragenter", "dragover"].forEach(event => dropZone.addEventListener(event, value => { value.preventDefault(); dropZone.classList.add("dragging"); }));
            ["dragleave", "drop"].forEach(event => dropZone.addEventListener(event, value => { value.preventDefault(); dropZone.classList.remove("dragging"); }));
            dropZone.addEventListener("drop", event => addFiles(event.dataTransfer.files));
            done.onclick = () => overlay.remove();
            overlay.onclick = event => { if (event.target === overlay) overlay.remove(); };
            dialog.append(title, rules, error, dropZone, input, previews, done);
            overlay.append(dialog);
            document.body.append(overlay);
            render();
        }

        async function uploadSelectedInspectionPhotos(reportUuid, onComplete) {
            showOmsLoading(omsText("uploadingFile"));
            try {
                // Send the whole inspection evidence set as one multipart
                // request. Previously each file caused a separate HTTP call
                // and a complete XLSX rebuild, making a 10–30-photo report
                // appear to save indefinitely on a remote deployment.
                const formData = new FormData();
                for (const [activityKey, photos] of umitafPendingInspectionPhotos.entries()) {
                    const description = umitafPendingInspectionPhotoDescriptions.get(activityKey) || "photo";
                    const baseName = description.replace(/[\\/:*?"<>|\u0000-\u001f]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 220) || "photo";
                    // The visible caption can legitimately repeat in different SIR
                    // sections. Persist the row key in the filename as invisible
                    // metadata for the UI; the server removes it from XLS captions.
                    const association = ` [oms:${activityKey}]`;
                    for (let index = 0; index < photos.length; index += 1) {
                        const file = photos[index];
                        const extension = (file.name.split(".").pop() || "jpg").toLowerCase();
                        // The server uses this durable caption to group photos
                        // beside the matching ongoing work in both the web
                        // preview and the generated XLSX evidence sheet.
                        const fileName = `${baseName}${association}${photos.length > 1 ? ` [photo ${index + 1}]` : ""}.${extension}`;
                        formData.append("file", file, fileName);
                    }
                }
                if (formData.getAll("file").length > 0) {
                    const response = await omsAuthenticatedFetch(omsApiUrl(`/inspection-reports/${reportUuid}/photos`), { method: "POST", body: formData, credentials: "include" });
                    if (!response.ok) throw new Error(await response.text());
                }
                umitafPendingInspectionPhotos.forEach(files => files.forEach(releasePendingInspectionPhoto));
                umitafPendingInspectionPhotos.clear();
                umitafPendingInspectionPhotoDescriptions.clear();
                onComplete("");
            } catch (error) {
                onComplete(error.message || String(error));
            } finally {
                hideOmsLoading();
            }
        }

        function hideDashboardPhotoSlider() {
            const pane = document.getElementById("dashboard-photo-slider");
            if (pane) pane.classList.remove("visible");
        }

        let omsDashboardInspectionPreviewHandler = () => {};
        function setDashboardInspectionPreviewHandler(handler) {
            omsDashboardInspectionPreviewHandler = typeof handler === "function" ? handler : () => {};
        }

        function showDashboardPhotoSlider(reportUuid, inspectionDate, subprojectCode, photosJson) {
            const pane = document.getElementById("dashboard-photo-slider");
            if (!pane) return;
            const photos = JSON.parse(photosJson);
            pane.replaceChildren();
            pane.classList.add("visible");

            const title = document.createElement(reportUuid ? "button" : "div");
            title.className = "photo-slider-title";
            if (reportUuid) {
                title.type = "button";
                title.setAttribute("aria-label", omsText("previewReport"));
                title.onclick = () => omsDashboardInspectionPreviewHandler(reportUuid);
            }
            title.textContent = inspectionDate
                ? `${omsText("lastInspection")}: ${formatOmsDate(inspectionDate)}${subprojectCode ? ` · ${omsText("subprojectCode")}: ${subprojectCode}` : ""}`
                : omsText("noReports");
            pane.append(title);
            if (!inspectionDate) return;

            if (!photos.length) {
                const empty = document.createElement("div");
                empty.className = "photo-slider-empty";
                empty.textContent = omsText("noPhotos");
                pane.append(empty);
                return;
            }

            const track = document.createElement("div");
            track.className = "photo-slider-track";
            photos.forEach(photo => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "photo-slider-item";
                button.setAttribute("aria-label", `${omsText("open")} ${photo.fileName}`);
                const image = document.createElement("img");
                image.alt = photo.fileName;
                image.loading = "lazy";
                image.addEventListener("error", () => {
                    if (image.dataset.originalAttempted !== "true") {
                        image.dataset.originalAttempted = "true";
                        omsSetImageSource(image, photo.downloadUrl);
                    } else {
                        image.remove();
                        button.classList.add("photo-slider-item-unavailable");
                        button.textContent = omsText("noPhotos");
                    }
                });
                omsSetImageSource(image, photo.thumbnailUrl);
                button.append(image);
                button.addEventListener("click", () => openPhotoLightbox(photos, photo.uuid));
                track.append(button);
            });
            pane.append(track);
        }

        function openPhotoLightbox(photos, selectedUuid) {
            let index = Math.max(0, photos.findIndex(photo => photo.uuid === selectedUuid));
            const overlay = document.createElement("div");
            overlay.className = "photo-lightbox";
            overlay.addEventListener("click", event => { if (event.target === overlay) overlay.remove(); });
            const close = document.createElement("button");
            close.className = "photo-lightbox-close";
            close.textContent = "×";
            close.setAttribute("aria-label", omsText("closeFullscreenPhoto"));
            close.onclick = () => overlay.remove();
            const previous = document.createElement("button");
            previous.className = "photo-lightbox-nav previous";
            previous.textContent = "‹";
            const next = document.createElement("button");
            next.className = "photo-lightbox-nav next";
            next.textContent = "›";
            const image = document.createElement("img");
            image.className = "photo-lightbox-image";
            const caption = document.createElement("div");
            caption.className = "photo-lightbox-caption";
            image.onerror = () => {
                image.removeAttribute("src");
                image.alt = omsText("noPhotos");
                caption.textContent = omsText("noPhotos");
            };
            const render = () => { omsSetImageSource(image, photos[index].downloadUrl); image.alt = photos[index].fileName; caption.textContent = `${photos[index].fileName} (${index + 1}/${photos.length})`; };
            previous.onclick = () => { index = (index - 1 + photos.length) % photos.length; render(); };
            next.onclick = () => { index = (index + 1) % photos.length; render(); };
            overlay.append(close, previous, image, next, caption);
            document.body.append(overlay);
            render();
        }

        // Read-only SIR screens deliberately use a normal Compose button for
        // evidence.  Opening the lightbox on demand avoids a fixed native DOM
        // gallery being placed above the application and swallowing navigation
        // clicks after a report has finished rendering.
        function openInspectionPhotoLightbox(photosJson) {
            const photos = JSON.parse(photosJson || "[]");
            if (photos.length) openPhotoLightbox(photos, photos[0].uuid);
        }

        const umitafNativePhotoGalleryRequests = new Map();

        function hideNativePhotoGallery(paneId) {
            umitafNativePhotoGalleryRequests.set(paneId, (umitafNativePhotoGalleryRequests.get(paneId) || 0) + 1);
            const pane = document.getElementById(paneId);
            if (pane) {
                pane.classList.remove("visible");
                pane.replaceChildren();
            }
        }

        // Compose disposes a screen asynchronously. Clear all body-level photo
        // panes on a screen transition so an old absolute element cannot ever
        // sit above the next screen and absorb pointer events.
        function hideAllInspectionNativePanes() {
            document.querySelectorAll('[id^="inspection-photo-preview-pane-"], [id^="inspection-report-photo-gallery-"], [id^="inspection-activity-photo-gallery-"]')
                .forEach(pane => hideNativePhotoGallery(pane.id));
        }

        function showNativePhotoGallery(paneId, photosJson) {
            const requestId = (umitafNativePhotoGalleryRequests.get(paneId) || 0) + 1;
            umitafNativePhotoGalleryRequests.set(paneId, requestId);
            const photos = JSON.parse(photosJson || "[]");
            // NativePaneAnchor creates its target after the Compose layout pass.
            // Retrying in the next frame prevents an empty report preview on
            // the first visit to a screen.
            const render = (attempt = 0) => {
                if (umitafNativePhotoGalleryRequests.get(paneId) !== requestId) return;
                const pane = document.getElementById(paneId);
                if (!pane) {
                    if (attempt < 3) requestAnimationFrame(() => render(attempt + 1));
                    return;
                }
                pane.replaceChildren();
                pane.classList.add("visible");
                if (!photos.length) {
                    const empty = document.createElement("div");
                    empty.className = "inspection-report-photo-gallery-empty";
                    empty.textContent = omsText("noPhotos");
                    pane.append(empty);
                    return;
                }
                const track = document.createElement("div");
                track.className = "inspection-report-photo-gallery-track";
                photos.forEach(photo => {
                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "inspection-report-photo-gallery-item";
                    button.setAttribute("aria-label", `${omsText("open")} ${photo.fileName}`);
                    const image = document.createElement("img");
                    image.alt = photo.fileName;
                    image.loading = "lazy";
                    image.addEventListener("error", () => {
                        if (image.dataset.originalAttempted !== "true") {
                            image.dataset.originalAttempted = "true";
                            omsSetImageSource(image, photo.downloadUrl);
                        } else {
                            button.classList.add("unavailable");
                            button.textContent = omsText("noPhotos");
                            image.remove();
                        }
                    });
                    omsSetImageSource(image, photo.thumbnailUrl);
                    button.append(image);
                    button.addEventListener("click", () => openPhotoLightbox(photos, photo.uuid));
                    track.append(button);
                });
                pane.append(track);
                if (photos.length > 1) {
                    const controls = document.createElement("div");
                    controls.className = "inspection-report-photo-gallery-controls";
                    const previous = document.createElement("button");
                    previous.type = "button";
                    previous.textContent = "‹";
                    previous.setAttribute("aria-label", omsText("previous"));
                    previous.onclick = () => track.scrollBy({ left: -track.clientWidth * .8, behavior: "smooth" });
                    const next = document.createElement("button");
                    next.type = "button";
                    next.textContent = "›";
                    next.setAttribute("aria-label", omsText("next"));
                    next.onclick = () => track.scrollBy({ left: track.clientWidth * .8, behavior: "smooth" });
                    controls.append(previous, next);
                    pane.append(controls);
                }
            };
            requestAnimationFrame(() => render());
        }

        function showInspectionReportPhotoGallery(reportUuid, photosJson) {
            showNativePhotoGallery(`inspection-report-photo-gallery-${reportUuid}`, photosJson);
        }
        function hideInspectionReportPhotoGallery(reportUuid) {
            hideNativePhotoGallery(`inspection-report-photo-gallery-${reportUuid}`);
        }
        function showInspectionActivityPhotoGallery(activityKey, photosJson) {
            showNativePhotoGallery(`inspection-activity-photo-gallery-${activityKey}`, photosJson);
        }
        function hideInspectionActivityPhotoGallery(activityKey) {
            hideNativePhotoGallery(`inspection-activity-photo-gallery-${activityKey}`);
        }

        function fitLeafletResults() {
            if (umitafLeafletMap && umitafMarkersLayer && umitafMarkersLayer.getLayers().length) {
                umitafLeafletMap.fitBounds(umitafMarkersLayer.getBounds(), { padding: [40, 40], maxZoom: 13 });
            }
        }

        function setLeafletProjects(projectsJson) {
            if (!initLeafletMap()) {
                ensureLeafletLoaded().then(loaded => {
                    if (loaded) setLeafletProjects(projectsJson);
                });
                return;
            }

            if (!umitafLeafletMap || !umitafMarkersLayer) return;

            umitafMarkersLayer.clearLayers();

            const projects = JSON.parse(projectsJson);

            if (!projects.length) {
                fitUkraineOverview();
                return;
            }

            const markerBounds = [];
            const coordinateUsage = new Map();
            projects.forEach(project => {
                const lat = project.latitude;
                const lng = project.longitude;
                const color = project.statusColor;
                const coordinateKey = `${lat.toFixed(6)},${lng.toFixed(6)}`;
                const duplicateIndex = coordinateUsage.get(coordinateKey) || 0;
                coordinateUsage.set(coordinateKey, duplicateIndex + 1);

                // User-provided names must be text, never interpreted as HTML.
                const popupHtml = document.createElement("div");
                popupHtml.className = "oms-map-preview";
                const name = document.createElement("strong");
                name.textContent = project.name;
                const region = document.createElement("p");
                region.textContent = project.regionLabel + ": " + project.region;
                const subprojectCode = document.createElement("p");
                subprojectCode.textContent = project.subprojectCodeLabel + ": " + (project.subprojectCode || "—");
                const status = document.createElement("p");
                const statusLabel = document.createElement("span");
                statusLabel.textContent = project.statusLabel + ": ";
                const statusBadge = document.createElement("span");
                statusBadge.className = "oms-map-status-badge";
                // Same colour and light tinted background as StatusChip in
                // the Projects registry; the colour is supplied by Kotlin's
                // shared ProjectStatus presentation mapping.
                statusBadge.style.color = color;
                statusBadge.style.backgroundColor = color + "17";
                statusBadge.textContent = project.statusText;
                status.append(statusLabel, statusBadge);
                const open = document.createElement("button");
                open.type = "button";
                open.textContent = omsText("details");
                open.onclick = () => umitafOnProjectClick && umitafOnProjectClick(project.id);
                popupHtml.append(name, subprojectCode, region, status, open);

                // Several facilities may share one postal address. Spread only
                // overlapping markers visually; their persisted GPS data remains exact.
                const radius = duplicateIndex === 0 ? 0 : 0.00018 * (1 + Math.floor((duplicateIndex - 1) / 6));
                const angle = duplicateIndex * (Math.PI * 2 / 6);
                const coordinates = [
                    lat + radius * Math.sin(angle),
                    lng + (radius * Math.cos(angle) / Math.cos(lat * Math.PI / 180))
                ];
                markerBounds.push(coordinates);
                L.marker(coordinates, {
                    icon: L.divIcon({
                        html: `<span class="oms-project-marker" style="--marker-color: ${color}"></span>`,
                        className: "",
                        iconSize: L.point(18, 18),
                        iconAnchor: L.point(9, 9)
                    })
                })
                    .bindPopup(popupHtml, {
                        autoPan: true,
                        keepInView: true,
                        // Include the popup tip/anchor offset so the whole opaque card
                        // remains inside the visible map instead of covering controls.
                        autoPanPaddingTopLeft: [24, 72],
                        autoPanPaddingBottomRight: [24, 24],
                        maxWidth: 340,
                        minWidth: 220
                    })
                    .addTo(umitafMarkersLayer);
            });

            // The map is an overview: opening it and changing filters must not
            // unexpectedly zoom into a single oblast or a group of facilities.
            // Wait until Compose has made the map host visible.  Without this second
            // pass Leaflet can retain a zoom calculated while the host had no width.
            setTimeout(fitUkraineOverview, 0);
        }


        let omsRouteHandler = null;
        function setOmsRouteHandler(handler) { omsRouteHandler = handler; }
        function pushOmsRoute(route) {
            if (window.location.hash !== "#" + route) history.pushState({ omsRoute: route }, "", "#" + route);
        }
        function replaceOmsRoute(route) { history.replaceState({ omsRoute: route }, "", "#" + route); }
        window.addEventListener("popstate", () => {
            if (omsRouteHandler) omsRouteHandler(window.location.hash.replace(/^#/, ""));
        });
    </script>
    <style>
        /* Startup only: Compose dismisses this after painting its real shell.
           Requests and section transitions must never reuse this element. */

        .oms-loading-spinner { width: 22px; height: 22px; border: 3px solid #17728a33; border-top-color: #17728a; border-radius: 50%; animation: oms-spin .7s linear infinite; }
        .oms-startup-main { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 34px 0; font-family: Inter, Arial, sans-serif; }

</div>

<script>
    window.omsBootstrappedDashboard = "";
    window.takeOmsBootstrappedDashboard = () => {
        const value = window.omsBootstrappedDashboard;
        window.omsBootstrappedDashboard = "";
        // Consuming cached data says nothing about whether the app is painted.
        return value;
    };
    performance.mark("oms-shell-visible");
    (async () => {
        const cards = document.getElementById("oms-startup-cards");
        try {
            const response = await omsAuthenticatedFetch(omsApiUrl("/dashboard/overview?background=true"));
            if (response.status === 401) { location.replace("/"); return; }
            if (!response.ok) throw new Error(`Dashboard ${response.status}`);
            const text = await response.text();
            const data = JSON.parse(text);
            window.omsBootstrappedDashboard = text;
            const subprojects = new Set([...(data.subprojectFunding || []), ...(data.subprojectProgress || [])].map(item => item.projectUuid)).size;
            const progress = data.subprojectProgress || [];
            const averageProgress = progress.length ? Math.round(progress.reduce((sum, item) => sum + Number(item.completionPct || 0), 0) / progress.length) : 0;
            const procurements = (data.procurementStatusCounts || []).reduce((sum, item) => sum + Number(item.value || 0), 0);
            const inspections = (data.recentInspections || []).length;
            const values = [["Субпроєкти", subprojects], ["Середнє виконання", `${averageProgress}%`], ["Закупівлі", procurements], ["Останні інспекції", inspections]];
            cards.innerHTML = values.map(([label, value]) => `<section class="oms-startup-card"><div class="oms-startup-label">${label}</div><div class="oms-startup-value">${value}</div></section>`).join("");
            performance.mark("oms-shell-useful");
            performance.measure("oms-shell-to-useful", "oms-shell-visible", "oms-shell-useful");
        } catch (error) {
            cards.innerHTML = '<div class="oms-startup-error">Не вдалося завантажити огляд. Повний інтерфейс продовжує завантаження.</div>';
        }
    })();
</script>
