<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UMITAF OMS — Вхід</title>
    <style>
        :root { color-scheme: light; font-family: Inter, Arial, sans-serif; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7fb; color: #172033; }
        main { box-sizing: border-box; width: min(420px, calc(100% - 32px)); padding: 36px; background: #fff; border-radius: 16px; box-shadow: 0 16px 50px #1e3a5f1c; }
        h1 { margin: 0 0 8px; font-size: 28px; } p { margin: 0 0 28px; color: #62708a; }
        label { display: block; margin: 16px 0 7px; font-weight: 600; }
        input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #c8d2e1; border-radius: 8px; font: inherit; }
        button { width: 100%; margin-top: 24px; padding: 13px; border: 0; border-radius: 8px; background: #1769aa; color: #fff; font: 600 16px inherit; cursor: pointer; }
        button:disabled { opacity: .65; cursor: wait; } #error { min-height: 20px; margin-top: 16px; color: #b42318; }
    </style>
</head>
<body>
<main>
    <h1>UMITAF OMS</h1>
    <p>Увійдіть, щоб відкрити систему моніторингу.</p>
    <form id="login-form">
        <label for="username">Логін</label>
        <input id="username" name="username" autocomplete="username" required autofocus>
        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="submit" type="submit">Увійти</button>
        <div id="error" role="alert"></div>
    </form>
</main>
<script>
    (() => {
        if (location.search) { location.replace('/app.html' + location.search); return; }
        const form = document.getElementById('login-form');
        const button = document.getElementById('submit');
        const error = document.getElementById('error');
        form.addEventListener('submit', async event => {
            event.preventDefault(); error.textContent = ''; button.disabled = true; button.textContent = 'Вхід…';
            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ username: form.username.value.trim(), password: form.password.value })
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(data.message || 'Не вдалося увійти. Перевірте логін і пароль.');
                if (data.browserBearerSupported && data.accessToken) sessionStorage.setItem('oms.accessToken', data.accessToken);
                location.replace('/app.html');
            } catch (cause) {
                error.textContent = cause.message || 'Не вдалося увійти. Спробуйте ще раз.';
                button.disabled = false; button.textContent = 'Увійти';
            }
        });
    })();
</script>
</body>
</html>
