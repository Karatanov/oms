<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>UMITAF OMS — Вхід</title>
<style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#20313c}*{box-sizing:border-box}body{margin:0;min-height:100vh}.page{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.brand{display:flex;align-items:center;padding:clamp(38px,7vw,108px);color:white;background:linear-gradient(130deg,#278dad,#16566c)}.brand>*{max-width:510px}.badge{display:inline-block;padding:7px 13px;border:1px solid #ffffff38;border-radius:6px;background:#ffffff18;font-weight:700;letter-spacing:.09em;font-size:12px}.brand h1{margin:28px 0 15px;font-size:clamp(35px,4vw,44px);line-height:1.18;letter-spacing:-.03em}.brand p{font-size:20px;line-height:1.5;color:#ffffffdf}.features{display:grid;gap:12px;margin:40px 0 0;padding:0;list-style:none;font-size:16px}.features li:before{content:"✓";display:inline-grid;place-items:center;width:22px;height:22px;margin-right:11px;border-radius:50%;background:#ffffff24;font-size:13px;font-weight:800}.form-panel{position:relative;display:grid;place-items:center;padding:48px 24px 88px;background:#fff}.card{width:min(440px,100%)}h2{margin:0 0 7px;font-size:29px;letter-spacing:-.025em}.hint{margin:0 0 29px;color:#536571}label{display:block;margin:17px 0 7px;color:#32465a;font-size:14px;font-weight:650}input[type=text],input[type=password]{width:100%;height:50px;padding:0 14px;border:1px solid #c9d4df;border-radius:6px;font:inherit;outline:0}input:focus{border-color:#278dad;box-shadow:0 0 0 3px #278dad22}.password{position:relative}.password input{padding-right:50px}.eye{position:absolute;right:1px;top:1px;width:48px;height:48px;border:0;background:transparent;color:#527083;cursor:pointer;font-size:18px}.options{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:18px 0 9px}.remember{display:flex;align-items:center;gap:8px;margin:0;color:#526579;font-weight:400}.remember input{accent-color:#278dad}.link{border:0;padding:4px 0;color:#226787;background:transparent;cursor:pointer;font:650 14px inherit}.primary,.guest{width:100%;
