ktor:

  deployment:

    # HTTP-порт серверного застосунку.
    port: 8080

    # Дозволяє автоматично перезапускати сервер
    # після зміни коду під час розробки.
    watch:
      - classes

  application:

    # Список модулів, які Ktor повинен викликати
    # після запуску HTTP-сервера.
    modules:
      - oms.ufsi.ApplicationKt.module

database:

  # JDBC-рядок підключення до локальної MySQL.
  url: "jdbc:mysql://localhost:3306/usif"
  # JDBC-драйвер MySQL.
  driver: "com.mysql.cj.jdbc.Driver"
  # Облікові дані робочого користувача застосунку.
  user: "usif_user"
  password: "usif_password"
  pool:

    # Максимальна кількість одночасних з'єднань.
    maxSize: 10

    # Мінімальна кількість готових з'єднань.
    minIdle: 2