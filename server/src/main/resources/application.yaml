ktor:

  deployment:

    # HTTP-порт серверного застосунку.
    # Render provides PORT; 8080 keeps the existing local workflow working.
    port: ${PORT:8080}

    # Render requires the public HTTP listener to bind to all interfaces.
    host: "0.0.0.0"

  application:

    # Список модулів, які Ktor повинен викликати
    # після запуску HTTP-сервера.
    modules:
      - oms.ufsi.ApplicationKt.module

database:

  # JDBC-рядок підключення до локальної MySQL.
  url: "${DATABASE_URL:jdbc:mysql://localhost:3306/usif}"
  # JDBC-драйвер MySQL.
  driver: "com.mysql.cj.jdbc.Driver"
  # Облікові дані робочого користувача застосунку.
  user: "${DATABASE_USER:usif_user}"
  # Required for every database-backed startup; no password is stored in source.
  password: "${DATABASE_PASSWORD:}"
  # mysql keeps the existing local Flyway migration set. Set to `tidb` on
  # Render when DATABASE_URL points to TiDB Cloud.
  dialect: "${DATABASE_DIALECT:mysql}"
  pool:

    # Максимальна кількість одночасних з'єднань.
    maxSize: ${DATABASE_POOL_MAX_SIZE:10}

    # Мінімальна кількість готових з'єднань.
    minIdle: ${DATABASE_POOL_MIN_IDLE:2}

cors:
  # Not required for the Render demo because UI and API share one origin.
  # Set this only if a separately hosted frontend needs to call the API.
  allowedHost: "${CORS_ALLOWED_HOST:}"

# Set OMS_JWT_SECRET to a random value of at least 32 characters in every
# persistent deployment. Without it the server creates an ephemeral development key.
